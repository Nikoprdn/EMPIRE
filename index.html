<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empire — Console de pilotage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Console de trading nocturne : graphite bleuté, accent laiton. Layout : barre de commande fixe + navigation latérale + grille de panneaux. */
:root{
  --bg:#0c1016; --panel:#141a22; --panel2:#1a222c; --line:#263240; --ink:#dde4ec; --muted:#8593a3;
  --accent:#d6a94e; --accent2:#f0cd84; --good:#3fb97a; --bad:#ef5d5d; --warn:#e3a33b; --info:#5aa7e6;
  --display:"Bodoni Moda",Didot,Georgia,serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h2{font-size:15px;font-weight:600;margin:0 0 12px;letter-spacing:.2px;text-wrap:balance}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:16px 0 8px}
.muted{color:var(--muted)} .small{font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}
/* top bar */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 18px;background:#0a0d12f2;border-bottom:1px solid var(--line);backdrop-filter:blur(6px);flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;letter-spacing:4px;color:var(--accent);display:flex;flex-direction:column;line-height:1}
.brand span{font-family:var(--body);font-size:11px;letter-spacing:.4px;color:var(--muted);margin-top:4px}
.tdate{display:flex;flex-direction:column;min-width:190px} .tdate b{font-weight:600;text-transform:capitalize} .tdate span{font-size:12px;color:var(--muted)}
.kpis{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.k{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;display:flex;flex-direction:column;min-width:118px}
.k span{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)} .k b{font-family:var(--mono);font-size:15px;font-weight:500} .k i{font-style:normal;font-size:11px;font-family:var(--mono)}
.adv{display:flex;gap:6px}
/* layout */
#wrap{display:grid;grid-template-columns:200px 1fr;min-height:calc(100% - 60px)}
#nav{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow-y:auto}
.nv{background:none;border:0;text-align:left;padding:9px 12px;border-radius:6px;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nv:hover{background:var(--panel);color:var(--ink)} .nv.on{background:var(--panel2);color:var(--accent2);box-shadow:inset 2px 0 0 var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 7px}
.navfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
#main{padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.grid{display:grid;gap:16px} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .tight{gap:10px}
.span2{grid-column:span 2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.alert{border-color:var(--warn);background:linear-gradient(180deg,#2a2112,var(--panel) 60%)}
.card.empty{text-align:center;padding:40px}
/* controls */
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--accent)} button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,.cdot:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
button.primary{background:var(--accent);color:#17120a;border-color:var(--accent);font-weight:600} button.primary:hover{background:var(--accent2)}
button.danger{border-color:#5a2a2a;color:#ff9b9b} button.ghost{background:none}
button.big{padding:10px 18px;font-size:15px} button.mini{padding:3px 8px;font-size:12px;margin:1px}
input,select,textarea{background:#0e131a;border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input[type=range]{padding:0;accent-color:var(--accent)} input.qty{width:90px;padding:3px 6px;font-size:12px;display:inline-block}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px} .row.wrap{flex-wrap:wrap} .row.end{justify-content:flex-end} .row>div{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px;flex-wrap:wrap} .seg button{border:0;border-radius:0;background:none;color:var(--muted)} .seg button.on{background:var(--panel2);color:var(--accent2)}
.actions{display:flex;flex-direction:column;gap:6px;margin:10px 0} .actions button{text-align:left}
/* tables */
.t{width:100%;border-collapse:collapse} .t td,.t th{padding:6px 8px;border-bottom:1px solid #1f2935;vertical-align:middle} .t th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:500;text-align:left}
.t.compact td{padding:4px 6px;font-size:12.5px} .t tr.tot td{border-top:1px solid var(--line);font-weight:600} .t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--panel2)}
.t.rank tr.me td{background:#2a2312} .scroll{overflow-x:auto} .cmp th{text-align:right}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed #212c38} .kv span{color:var(--muted)} .kv b{font-family:var(--mono);font-weight:500;text-align:right}
.kv.big b{font-size:16px}
.stat{background:var(--panel2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px} .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px} .stat b{font-family:var(--mono);font-weight:500;font-size:16px}
.bar{display:block;height:6px;background:#0c1117;border-radius:3px;overflow:hidden;min-width:60px} .bar i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);background:#0e131a;white-space:nowrap}
.pill.good{color:var(--good);border-color:#24553c} .pill.bad{color:var(--bad);border-color:#5a2a2a} .pill.warn{color:var(--warn);border-color:#5c4320} .pill.info{color:var(--info);border-color:#244a6b}
.warnline{color:var(--warn);font-size:13px}
/* charts */
.chart{width:100%;height:auto;display:block} .chart .grid,.map .grid{stroke:#1f2935} .chart .ax{fill:var(--muted);font:11px var(--mono)}
.spark{display:block;max-width:100%}
/* feed */
.feed{list-style:none;padding:0;margin:0 0 10px;font-size:13px} .feed li{padding:6px 0 6px 10px;border-left:2px solid var(--line);margin-bottom:2px} .feed li span{color:var(--muted);font-family:var(--mono);font-size:11px;margin-right:8px}
.feed li.bad{border-color:var(--bad)} .feed li.good{border-color:var(--good)} .feed li.info{border-color:#3a4a5c}
.feed.long li{padding:5px 0 5px 10px}
.decision{background:#0e131a;border:1px solid #4a3a1c;border-radius:8px;padding:12px;margin-bottom:10px} .decision .dh{font-weight:600;display:flex;justify-content:space-between} .decision p{margin:6px 0}
/* map */
.mapwrap{overflow-x:auto} .map{width:100%;min-width:600px;height:auto;background:radial-gradient(ellipse at 40% 40%,#14202d,#0d131a);border-radius:8px}
.cdot{cursor:pointer} .cdot circle{fill:#2b3b4d;stroke:#5c7590;stroke-width:1} .cdot circle.own{fill:var(--accent);stroke:var(--accent2)} .cdot:hover circle{stroke:var(--accent2);stroke-width:2}
.cdot text{fill:var(--ink);font:600 12px var(--body)} .cdot text.sub{fill:var(--muted);font:400 10.5px var(--mono)}
/* opportunities */
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.opp{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px}
.oh{display:flex;gap:10px;margin-bottom:6px} .oh b{display:block} .ico{font-size:22px;line-height:1}
/* business cards */
.bizgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.bcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column} .bcard.click{cursor:pointer} .bcard.click:hover{border-color:var(--accent)}
.bb{padding:12px;display:flex;flex-direction:column;gap:2px} .bb>b{font-size:14.5px}
.art{display:block;width:100%;height:auto;max-width:100%}
.hero{border-radius:8px;overflow:hidden;margin-bottom:14px;max-height:300px} .hero .art{max-height:300px;object-fit:cover}
.dirbox{background:var(--panel2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.staff td{font-size:13px}
.execgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px} .exec{background:var(--panel2);border-radius:8px;padding:12px} .exec h3{margin-top:0;color:var(--accent2)}
.score{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap} .score b{font-family:var(--mono);font-size:30px;font-weight:500} .score .bar{flex-basis:100%}
.list{list-style:none;padding:0;margin:0} .list li{padding:5px 0;border-bottom:1px dashed #212c38} .list li.click{cursor:pointer} .list li.click:hover{color:var(--accent2)}
.notes{padding-left:18px;margin:10px 0;font-size:12.5px;color:#b9c4cf} .notes li{margin-bottom:4px}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px} details{background:var(--panel2);border-radius:8px;padding:8px 10px} summary{cursor:pointer;font-weight:600}
/* quote */
.quote{border-radius:8px;padding:10px;margin:10px 0;border:1px solid var(--line)} .quote.ok{border-color:#24553c;background:#10201a} .quote.ko{border-color:#5a2a2a;background:#221315}
.qh{font-weight:600;margin-bottom:6px} .reasons{margin:8px 0 0;padding-left:18px;color:#ff9b9b;font-size:12.5px}
.estbox{background:#0e131a;border-radius:8px;padding:10px;margin-top:10px}
/* modal & toast */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto} #modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(560px,100%)} .mbox.wide{width:min(980px,100%)}
.help p{max-width:72ch}
textarea{font-family:var(--mono);font-size:11px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--panel2);border:1px solid var(--accent);padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)} #toast.bad{border-color:var(--bad)}
/* start */
.startbox{max-width:640px;margin:6vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.logo{font-family:var(--display);font-size:54px;letter-spacing:12px;color:var(--accent);line-height:1}
.lede{font-size:15px;color:#c2ccd6;max-width:62ch}
.form{display:grid;grid-template-columns:180px 1fr;gap:8px 12px;align-items:center;margin:18px 0} .form label{margin:0}
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.span2{grid-column:span 2}.g4{grid-template-columns:1fr 1fr}}
@media (max-width:760px){#wrap{grid-template-columns:1fr}#nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.navfoot{flex-direction:row;margin:0}
  .g2,.g3{grid-template-columns:1fr}.span2{grid-column:auto}.form{grid-template-columns:1fr}#top{position:static}.kpis .k{min-width:100px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <div id="wrap"><nav id="nav" aria-label="Navigation"></nav><main id="main"></main></div>
</div>
<div id="start"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ==========================================================================
   EMPIRE — moteur de simulation
   ========================================================================== */
const R = Math.random;
const rnd = (a, b) => a + (b - a) * R();
const ri = (a, b) => Math.floor(a + (b - a + 1) * R());
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function gauss() { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function poisson(l) { if (l <= 0) return 0; if (l > 30) return Math.max(0, Math.round(l + Math.sqrt(l) * gauss())); const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= R(); } while (p > L); return k - 1; }
const uid = () => Math.random().toString(36).slice(2, 10);
function eur(n) {
  if (n == null || isNaN(n)) return '—';
  const s = n < 0 ? '−' : ''; n = Math.abs(n);
  if (n >= 1e9) return s + (n / 1e9).toFixed(2).replace('.', ',') + ' Md€';
  if (n >= 1e6) return s + (n / 1e6).toFixed(2).replace('.', ',') + ' M€';
  if (n >= 1e4) return s + Math.round(n / 1e3).toLocaleString('fr-FR') + ' k€';
  return s + Math.round(n).toLocaleString('fr-FR') + ' €';
}
const pct = (x, d = 1) => (x * 100).toFixed(d).replace('.', ',') + ' %';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const START = Date.UTC(2027, 0, 1);
const dateOf = d => new Date(START + d * 864e5);
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const fdate = d => { const t = dateOf(d); return `${JOURS[t.getUTCDay()]} ${t.getUTCDate()} ${MOIS[t.getUTCMonth()]} ${t.getUTCFullYear()}`; };
const sdate = d => { const t = dateOf(d); return `${String(t.getUTCDate()).padStart(2, '0')}/${String(t.getUTCMonth() + 1).padStart(2, '0')}/${t.getUTCFullYear()}`; };

    notes: ['Flat tax de 30 % sur les dividendes', 'IFI : 1 % sur le patrimoine immobilier net au-delà de 1,3 M€', 'Exit tax (30 %) sur les plus-values latentes en cas de départ hors UE avec plus de 800 k€ de titres', 'Charges patronales parmi les plus lourdes d\'Europe (~42 %)', 'Licenciements coûteux, prud\'hommes fréquents, grèves', 'Frais de mutation immobiliers ~7,5 % — procédures d\'expulsion longues (trêve hivernale)'] },

function news(type, text, major) {
  G.log.unshift({ d: G.day, t: type, x: text });
  if (G.log.length > 600) G.log.length = 600;
  if (major) addDecision({ title: type === 'good' ? 'Bonne nouvelle' : type === 'bad' ? 'Incident' : 'Information', text, choices: [{ l: 'Compris', k: 'ok' }] });
}
function addDecision(d) { G.pending.push(Object.assign({ id: uid(), d: G.day }, d)); }

  let m = 1;
  if (shock('pandemie')) m *= { fastfood: .7, nightclub: 0, hotel: .35, yacht: .5, cardealer: .8 }[sector];

  let s = 0, t = 0; for (const k in S.w) { s += S.w[k] * v[k]; t += S.w[k]; } return s / t;
}
function staffReq(b) {
  const S = SECTORS[b.sector], r = {};
  const vm = ['fastfood', 'nightclub', 'hotel'].includes(b.sector) ? clamp(demandIdx(CITY[b.city], S), .6, 1.5) : 1;
  for (const k in S.roles) r[k] = Math.ceil(S.roles[k][1] * (b.sector === 'yacht' ? 1 : b.size) * (S.roles[k][1] > 1 ? vm : 1));
  if (b.sector === 'yacht') { r.skipper = b.fleet.length; r.matelot = b.fleet.reduce((a, y) => a + YACHTS[y.m].crew, 0); }
  return r;
}
function roleInfo(b, k) {

}
function staffFactor(b) {

  for (const k in req) { const need = req[k]; if (!need) continue; const w = roleInfo(b, k)[3]; const r = (b.staff[k] || 0) / need; s += w * (r < 1 ? Math.pow(r, 1.3) : 1 + Math.min(r - 1, .3) * .15); sw += w; }
  return sw ? s / sw : 1;
}
function quality(b, noRep) {

  q *= .6 + .4 * b.cond / 100;
  if (!noRep) q *= .7 + .6 * b.rep / 100;
  if (G.execs.pdg) q *= 1 + G.execs.pdg.skill / 2000;

}
function staffMonthly(b) {

  for (const k in b.staff) s += (b.staff[k] || 0) * roleInfo(b, k)[2] * C.wage * (b.raise || 1);
  if (b.dir) s += b.dir.sal;

}
function rentMonthly(b) {

  return SECTORS[b.sector].rent * b.size * Math.pow(ci.m2 / 6000, .9) * fxOf(ci.c);
}
const fleetValue = b => b.sector === 'yacht' ? b.fleet.reduce((a, y) => a + y.v, 0) : 0;
const bizValue = b => b.val + fleetValue(b);

function bizRevenue(b, x, st) {
  const n = () => st ? Math.max(0, 1 + gauss() * .12) : 1;
  let g = 0, c = x.S.cogs;
  switch (b.sector) {
    case 'fastfood': { const wdf = [1.05, .9, .88, .92, 1, 1.2, 1.25][x.wd]; g = 1000 * b.size * x.dem * x.q * x.econ * x.pv * wdf * n() * 11 * x.cp * b.price; break; }
    case 'nightclub': { const wdf = [.15, 0, 0, .35, .6, 1, 1.15][x.wd]; const cust = Math.min(650 * b.size, 400 * b.size * x.dem * x.q * x.econ * x.pv * wdf * n()); g = cust * 40 * x.cp * b.price; break; }
    case 'yacht': {
      const occ = clamp(SEASON_Y[x.m] * (['TR', 'GR'].includes(x.ci.c) ? 1.2 : 1) * .85 * Math.sqrt(x.dem) * x.q * x.econ * x.pv, 0, .97);
      for (const y of b.fleet) { if ((y.down || 0) > G.day) continue; const p = st ? (R() < occ ? 1 : 0) : occ; g += p * YACHTS[y.m].rate * clamp(x.cp, .7, 1.3) * b.price; }
      break;
    }
    case 'cardealer': {

      const sales = st ? poisson(lam) : lam; const avg = 150000 * clamp(x.cp, .7, 1.6);
      const margin = clamp(.12 + (b.price - 1) * .4, .01, .3);
      const car = sales * avg, at = 1800 * b.size * x.q * clamp(x.cp, .7, 1.6) * (x.wd === 0 ? 0 : 1) * n();

    }

}
function dayEcon(b, day, st) {
  const S = SECTORS[b.sector], ci = CITY[b.city], C = CO(ci.c), dt = dateOf(day);
  const closed = b.closedUntil > day || (shock('pandemie') && b.sector === 'nightclub');
  const x = { S, ci, C, m: dt.getUTCMonth(), wd: dt.getUTCDay(), dem: demandIdx(ci, S), econ: Math.pow(G.eco.conf, S.beta) * shockMult(b.sector), q: quality(b), pv: Math.pow(b.price, -S.el), cp: cityPrice(ci) * fxOf(ci.c) };

  return { net, cogs, roy, fg, staff, rent, ins, maint, ebitda: net - cogs - roy - fg - staff - rent - ins - maint, closed, q: x.q };

  const cu = b.closedUntil; b.closedUntil = 0;
  for (let i = 0; i < N; i++) { const e = dayEcon(b, G.day + i * 7 + (i % 7), false); net += e.net; eb += e.ebitda; }
  b.closedUntil = cu;

function trailing(b, n = 30) { const h = b.h.slice(-n); if (!h.length) return null; return { net: h.reduce((a, x) => a + x[0], 0), eb: h.reduce((a, x) => a + x[1], 0), n: h.length }; }

/* ---------------- Immobilier */
function propValue(p) {
  const ci = CITY[p.city]; return p.m2 * ci.m2 * RT[p.type].f * G.rm[p.city] * fxOf(ci.c) * (.75 + .25 * p.cond / 100);
}
function propYield(p) { return CO(CITY[p.city].c).yield + RT[p.type].y; }
function propRentGross(p) { return propValue(p) * propYield(p) / 12; }
function propNetMonthly(p) {
  const C = CO(CITY[p.city].c); const g = propRentGross(p) * p.occ * (p.squat ? 0 : 1);

/* ==========================================================================
   LISTINGS (opportunités)
   ========================================================================== */
function bizName(sector, ci) { const S = SECTORS[sector]; return `${pick(S.brands)} ${ci.n}${sector === 'fastfood' ? ' ' + pick(['Centre', 'Gare', 'Nord', 'Sud', 'Est', 'Ouest', 'Rivoli', 'Aéroport']) : ''}`; }
function genDirector(c, lvl) {

function genListing(cid) {

    const sector = pick(opts), S = SECTORS[sector];

    if (sector === 'yacht') { const n = ri(1, 3); for (let i = 0; i < n; i++) { const m = R() < .45 ? 0 : R() < .75 ? 1 : 2; b.fleet.push({ id: uid(), m, v: YACHTS[m].v * rnd(.65, 1) }); } }

/* ==========================================================================
   BANQUE
   ========================================================================== */
const euribor = () => G.eco.ecb + .001;
function monthlyIncome() {
  let s = 0; for (const b of G.biz) { const t = trailing(b, 30); if (t) s += t.eb / t.n * 30.4; }
  for (const p of G.props) if (!p.sale) s += propNetMonthly(p);
  return s;
}
function loanPaymentMonthly(l) { const r = l.rate / 12; if (LOANT[l.type].inFine) return l.rem * r; return annuity(l.rem, l.rate, l.left); }
function annuity(P, rate, n) { const r = rate / 12; if (n <= 0) return P; if (r <= 0) return P / n; return P * r / (1 - Math.pow(1 + r, -n)); }
const debtTotal = () => G.loans.reduce((a, l) => a + l.rem, 0);
function collateralValue(col) {
  if (!col) return 0;
  if (col.k === 'biz') { const b = G.biz.find(x => x.id === col.id); return b ? bizValue(b) : 0; }
  if (col.k === 'prop') { const p = G.props.find(x => x.id === col.id); return p ? propValue(p) : 0; }
  if (col.k === 'proj') { const p = G.projs.find(x => x.id === col.id); return p ? projBook(p) + p.budget * .3 : 0; }
  if (col.k === 'port') return portValue();
  return 0;
}
const loansOn = col => G.loans.filter(l => l.col && l.col.k === col.k && l.col.id === col.id).reduce((a, l) => a + l.rem, 0);
function riskPremium() { const s = G.score; return s >= 700 ? -(s - 700) / 100 * .002 : (700 - s) / 100 * .006; }
function prestige() { return G.lux.reduce((a, x) => a + LUX[x.i].pr, 0) + G.biz.length * 2 + G.props.length; }
function overdraftLimit() { return 50000 + .03 * grossAssetsHolding() + (G.execs.daf ? .01 * grossAssetsHolding() : 0); }

function loanQuote(o) {
  // o: {type, amount, months, fixed, value (valeur du bien), income (revenu mensuel du bien), country, col, extraCost}
  const T = LOANT[o.type], C = CO(o.country || G.holdC), e = G.eco, reasons = [];
  const fixed = T.varOnly ? false : o.fixed;
  const base = fixed ? e.ecb + .003 + o.months / 12 * .0005 : euribor();
  const spread = C.spr + (G.spreadAdj[o.country] || 0);
  const ltv = o.value ? o.amount / o.value : 0;
  const ltvP = ltv > .5 ? (ltv - .5) * .015 : 0;
  const daf = G.execs.daf ? G.execs.daf.skill / 100 * .004 : 0;
  const priv = netWorth() > 2e7 ? .003 : 0;
  const ins = o.type === 'lomb' ? 0 : .0025;
  const rate = Math.max(.005, base + T.m + spread + riskPremium() + ltvP - daf - priv) + ins;
  const pay = T.inFine ? o.amount * rate / 12 : annuity(o.amount, rate, o.months);
  const fees = Math.max(1000, o.amount * .01);
  let cap = T.ltv; if (C.ltvCap && o.type !== 'lomb' && o.type !== 'treso') cap = Math.min(cap, C.ltvCap);
  if (shock('immo') && (o.type === 're' || o.type === 'promo')) cap -= .1;
  if (o.amount <= 0) reasons.push('Montant nul');
  if (o.months > T.max) reasons.push(`Durée maximale : ${T.max} mois`);
  if (G.score < 450) reasons.push(`Score de crédit insuffisant (${G.score} < 450)`);
  if (G.loans.some(l => l.missed > 0)) reasons.push('Incident de paiement en cours sur un autre prêt');
  if (G.hold < -overdraftLimit()) reasons.push('Compte de la holding au-delà du découvert autorisé');
  if (o.type === 'treso') {
    const maxT = Math.min(2e6, Math.max(0, monthlyIncome() * 3));
    if (o.amount > maxT) reasons.push(`Trésorerie : plafond de ${eur(maxT)} (3 mois d'EBITDA)`);
  } else if (o.value) {
    const avail = cap * o.value - (o.existing || 0);
    if (o.amount > avail + 1) reasons.push(`Apport insuffisant : la banque finance au plus ${pct(cap, 0)} de la valeur (${eur(Math.max(0, avail))})`);
  }
  const existing = G.loans.reduce((a, l) => a + loanPaymentMonthly(l), 0);
  const inc = monthlyIncome() + (o.income || 0);
  let dscr = null;
  if (o.type !== 'lomb' && o.type !== 'promo') {
    dscr = inc / Math.max(1, existing + pay);
    if (dscr < 1.2) reasons.push(`Capacité de remboursement insuffisante : revenus / échéances = ${dscr.toFixed(2).replace('.', ',')} (minimum 1,20)`);
  }
  if (o.type === 'promo' && G.hold + o.amount < (o.extraCost || 0) * .1) reasons.push('La banque exige une réserve de trésorerie d\'au moins 10 % du budget travaux');
  return { ok: !reasons.length, reasons, rate, pay, fees, fixed, parts: { base, marge: T.m, pays: spread, risque: riskPremium(), ltv: ltvP, daf: -daf, prive: -priv, assurance: ins }, dscr, cap };
}
function createLoan(o, q, label) {
  const T = LOANT[o.type];
  const l = { id: uid(), type: o.type, label: label || T.n, principal: o.amount, rem: o.amount, rate: q.rate, fixed: q.fixed, margin: q.rate - euribor(), months: o.months, left: o.months, col: o.col || null, missed: 0, start: G.day, country: o.country || G.holdC };
  G.loans.push(l);
  G.hold += o.amount - q.fees;
  G.tb[l.country] = (G.tb[l.country] || 0) - q.fees;
  news('info', `🏦 Prêt accordé : ${l.label} de ${eur(o.amount)} à ${pct(q.rate, 2)} ${q.fixed ? 'fixe' : 'variable'} sur ${o.months} mois. Frais de dossier ${eur(q.fees)}.`);

function repayLoan(l, amount, forced) {
  amount = Math.min(amount, l.rem);
  const pen = forced ? 0 : (l.fixed ? .03 : .01) * amount;
  G.hold -= amount + pen; l.rem -= amount;
  if (pen) G.tb[l.country] = (G.tb[l.country] || 0) - pen;
  if (l.rem < 1) G.loans = G.loans.filter(x => x !== l);

/* ==========================================================================

function portValue() { let s = 0; for (const t in G.port) { const st = G.stocks.find(x => x.t === t); s += st.p * G.port[t].q; } return s; }
function grossAssetsHolding() {

}
const luxValue = () => G.lux.reduce((a, x) => a + x.v, 0);

  return G.hold + G.perso + G.monacoDep + G.biz.reduce((a, b) => a + bizValue(b), 0) + G.props.reduce((a, p) => a + propValue(p), 0)
    + G.projs.reduce((a, p) => a + projBook(p) + (p.escrow || 0), 0) + portValue() + luxValue() - debtTotal();
}
const ptc = () => { const c = CITY[G.resCity].c; return (c === 'MC' && G.nat === 'FR') ? 'FR' : c; };
function divTaxRate() { const c = ptc(); if (c === 'IT' && G.flatIT) return 0; return CO(c).div; }

/* ==========================================================================
   DIRECTION
   ========================================================================== */
function genExecCands(role) {

  for (let i = 0; i < 3; i++) {

/* ==========================================================================
   SIMULATION QUOTIDIENNE
   ========================================================================== */
function stepMarkets(pre) {
  const e = G.eco, ph = PH[e.phase];
  let m = ph.mu / 365 + ph.vol / Math.sqrt(365) * gauss();
  if (e.crash > 0) { m -= .012 + R() * .012; e.crash--; }
  for (const s of G.stocks) {
    let sh = 0;
    if (shock('pandemie') && ['Restauration', 'Loisirs', 'Nautisme', 'Aéronautique'].includes(s.sec)) sh -= .004;
    if (shock('pandemie') && s.sec === 'Santé') sh += .003;
    if (shock('energie') && s.sec === 'Énergie') sh += .002;
    if (shock('immo') && ['Immobilier', 'BTP', 'Banque'].includes(s.sec)) sh -= .002;
    s.p *= Math.exp(s.b * m + .013 * gauss() + sh);
    s.p = Math.max(.5, s.p);
    s.h.push(+s.p.toFixed(3)); if (s.h.length > 250) s.h.shift();
  }
  e.idx = G.stocks.reduce((a, s) => a + s.p / (s.p0 || s.p), 0) / G.stocks.length * 5000;
  if (!pre) { e.idxH.push(+e.idx.toFixed(1)); if (e.idxH.length > 400) e.idxH.shift(); }
  for (const cur in G.fx) { const f = FXP[cur]; G.fx[cur] *= Math.exp(f.d + f.v * gauss() - (cur === 'TRY' && e.phase === 'recession' ? .0005 : 0)); }
}

function stepBiz(b) {
  const e = dayEcon(b, G.day, true), ci = CITY[b.city], C = CO(ci.c);
  G.hold += e.ebitda;
  G.tb[ci.c] = (G.tb[ci.c] || 0) + e.ebitda;
  b.h.push([Math.round(e.net), Math.round(e.ebitda)]); if (b.h.length > 400) b.h.shift();
  // réputation & état
  const target = clamp(35 + (quality(b, true) - .7) * 120 + (b.mk > G.day ? 15 : 0) + (b.price < 1 ? 5 : b.price > 1 ? -4 : 0) + (b.sector === 'nightclub' ? prestige() / 40 : 0), 5, 98);
  b.rep += (target - b.rep) * .01;
  const req = staffReq(b), er = req.entretien ? (b.staff.entretien || 0) / req.entretien : 1;
  b.cond = clamp(b.cond - .045 * (er < 1 ? 1 / Math.max(.25, er * er) : 1), 0, 100);
  if (b.sector === 'yacht') b.fleet.forEach(y => y.v *= 1 - .06 / 365);
  bizIncidents(b, e, C, req);
}

function bizIncidents(b, e, C, req) {
  if (b.closedUntil > G.day) return;
  const ratio = k => req[k] ? (b.staff[k] || 0) / req[k] : 1;
  const drh = G.execs.drh ? .5 : 1, jur = G.execs.jur ? .5 : 1;
  const ci = CITY[b.city];
  if (R() < .00006 * (b.cond < 40 ? 2.5 : 1)) {
    const dmg = bizValue(b) * rnd(.08, .3), paid = b.insured ? dmg * .9 : 0, days = ri(30, 90);
    G.hold -= dmg - paid; b.closedUntil = G.day + days; b.cond = Math.max(10, b.cond - 40);
    news('bad', `🔥 Incendie à ${b.name} : dégâts ${eur(dmg)}${b.insured ? `, remboursés ${eur(paid)} par l'assurance` : ' — ÉTABLISSEMENT NON ASSURÉ'}. Fermeture ${days} jours.`, true);
    return;
  }
  if ((b.sector === 'fastfood' || b.sector === 'hotel') && R() < .0015 * (ratio('entretien') < 1 ? 3 : 1)) {
    if (b.cond < 50 || ratio('entretien') < .8) {
      const fine = 15000 * jur; G.hold -= fine; b.closedUntil = G.day + 7; b.rep -= 12;
      news('bad', `🧪 Contrôle sanitaire défavorable à ${b.name} : fermeture administrative 7 jours, amende ${eur(fine)}. Hygiène insuffisante (personnel d'entretien / état des locaux).`, true);
    } else news('good', `🧪 Contrôle sanitaire satisfaisant à ${b.name}.`);
    return;
  }
  if (R() < .0004 * (C.strike || 1) * drh) {
    addDecision({ title: `Grève — ${b.name}`, text: `Le personnel de ${b.name} (${ci.n}) se met en grève et réclame une hausse de salaire de 4 %.`, choices: [{ l: 'Accorder +4 % de salaire', k: 'greve_ok', a: { b: b.id } }, { l: 'Tenir bon (fermeture de 4 à 12 jours)', k: 'greve_no', a: { b: b.id } }] });
    return;
  }
  if (R() < .0003 * C.sev * drh) {
    const fine = rnd(15000, 60000) * C.sev * jur; G.hold -= fine;
    news('bad', `⚖️ Litige prud'homal perdu (${b.name}, ${C.n}) : ${eur(fine)} d'indemnités.`); return;
  }
  if (b.sector === 'nightclub') {
    if (R() < .0012 * C.night * (ratio('securite') < 1 ? 3 : 1)) {
      const days = Math.round(ri(15, 60) * (G.execs.jur ? .6 : 1)); b.closedUntil = G.day + days; b.rep -= 10;
      news('bad', `🚨 Rixe à ${b.name} : fermeture administrative de ${days} jours ordonnée par la préfecture/police (${C.n}).${ratio('securite') < 1 ? ' Effectif de sécurité insuffisant.' : ''}`, true); return;
    }
    if (R() < .0002 * C.night) {
      b.closedUntil = G.day + 90; b.rep -= 25; const fine = 80000 * jur; G.hold -= fine;
      news('bad', `🚔 Descente de police pour trafic de stupéfiants à ${b.name} : fermeture 90 jours, amende ${eur(fine)}.`, true); return;
    }
  }
  if (b.sector === 'yacht') {
    const m = dateOf(G.day).getUTCMonth();
    for (const y of b.fleet) {
      if ((y.down || 0) > G.day) continue;
      if (R() < .0015 * SEASON_Y[m] * 3) { const cost = y.v * rnd(.01, .04); G.hold -= cost; y.down = G.day + ri(7, 21); news('bad', `🔧 Avarie moteur sur le ${YACHTS[y.m].n} (${b.name}) : ${eur(cost)} de réparations, immobilisé.`); return; }
      if (R() < .00025) { const dmg = y.v * rnd(.1, .3), paid = b.insured ? dmg * .85 : 0; G.hold -= dmg - paid; y.v -= dmg * .5; y.down = G.day + ri(30, 60); news('bad', `🌊 Tempête : le ${YACHTS[y.m].n} de ${b.name} est endommagé (${eur(dmg)}${b.insured ? ', assuré' : ', NON ASSURÉ'}).`, true); return; }
    }
  }
  if (b.sector === 'cardealer' && R() < .0007) {
    const loss = rnd(120000, 400000), paid = b.insured ? loss * .8 : 0; G.hold -= loss - paid;
    news('bad', `🚗 Vol de véhicules chez ${b.name} : ${eur(loss)}${b.insured ? ` (assurance : ${eur(paid)})` : ''}.`); return;
  }
  if (R() < .0005) { b.rep = Math.max(0, b.rep - 15); news('bad', `📱 Bad buzz sur les réseaux sociaux : ${b.name} perd 15 points de réputation.`); return; }
  if (R() < .0004) { b.rep = Math.min(100, b.rep + 12); news('good', `⭐ Une célébrité a été vue à ${b.name} : +12 de réputation.`); return; }
  if (b.dir && b.dir.trait === 'Véreux' && R() < .003) {
    const amt = rnd(20000, 250000) * b.size; G.hold -= amt;
    addDecision({ title: `Détournement de fonds — ${b.name}`, text: `Un audit révèle que votre directeur ${b.dir.n} a détourné ${eur(amt)}.`, choices: [{ l: 'Porter plainte et le licencier (40 % de chances de récupérer la moitié)', k: 'fraud_sue', a: { b: b.id, amt } }, { l: 'Le licencier discrètement', k: 'fraud_fire', a: { b: b.id } }] });
    return;
  }
  if (b.dir && R() < .0006) { news('bad', `👋 ${b.dir.n}, directeur de ${b.name}, démissionne pour rejoindre un concurrent.`, true); b.dir = null; return; }
  if (R() < .00025) {
    const offer = bizValue(b) * rnd(1.15, 1.5), who = pick(G.rivals).n;
    addDecision({ title: `Offre de rachat — ${b.name}`, text: `${who} vous propose de racheter ${b.name} pour ${eur(offer)} (valorisation actuelle ${eur(bizValue(b))}).`, choices: [{ l: `Accepter (${eur(offer)})`, k: 'sell_offer', a: { b: b.id, offer } }, { l: 'Refuser', k: 'ok' }] });
  }
}

function stepProj(p) {
  const ci = CITY[p.city], C = CO(ci.c), di = G.execs.immo ? .5 : 1;
  if (p.phase === 'permis') {
    if (G.day >= p.end) {
      const refuse = .1 * C.bur * (G.execs.jur ? .6 : 1);
      if (!p.appeal && R() < refuse) {
        p.phase = 'bloque';
        addDecision({ title: `Permis refusé — ${p.name}`, text: `La mairie de ${ci.n} refuse votre permis de construire (${C.n} : bureaucratie ×${C.bur}).`, choices: [{ l: 'Déposer un recours (50 k€, 60 % de succès, +4 mois)', k: 'permit_appeal', a: { p: p.id } }, { l: 'Abandonner et revendre le terrain (−15 %)', k: 'permit_quit', a: { p: p.id } }] });
      } else {
        p.phase = 'travaux'; p.t0 = G.day; p.dur = Math.round((240 + p.m2 / 25) * rnd(.9, 1.1)); p.end = G.day + p.dur;
        news('good', `🏗️ Permis obtenu pour ${p.name}. Début des travaux (${p.dur} jours prévus).`);
      }
    }
    return;
  }
  if (p.phase !== 'travaux') return;
  const daily = p.budget * (1 + p.over) / p.dur;
  let pay = Math.min(daily, p.budget * (1 + p.over) - p.spent);
  if (pay > 0) {
    const fromE = Math.min(p.escrow, pay); p.escrow -= fromE; G.hold -= pay - fromE; p.spent += pay;
  }
  if (R() < .002 * di) { const o = rnd(.04, .15); p.over += o; news('bad', `💸 Dépassement de budget sur ${p.name} : +${pct(o, 0)} (aléas de chantier, prix des matériaux).`); }
  if (R() < .0015 * di) { const d = ri(20, 90); p.end += d; p.dur += d; news('bad', `⏳ Retard de chantier sur ${p.name} : +${d} jours.`); }
  if (R() < .0003) { const d = ri(45, 120); p.end += d; p.dur += d; p.over += .08; news('bad', `🏚️ Faillite de l'entreprise de gros œuvre sur ${p.name} : +${d} jours, +8 % de coûts.`, true); }
  if (G.day >= p.end && p.spent >= p.budget * (1 + p.over) - 1) {
    p.phase = 'livre';
    const prop = { id: uid(), type: p.type, city: p.city, m2: p.m2, cond: 100, occ: .9, name: p.name, squat: 0, cost: projBook(p), bought: G.day, fresh: true };
    G.props.push(prop);
    // transfère les prêts promoteur sur le bien
    G.loans.forEach(l => { if (l.col && l.col.k === 'proj' && l.col.id === p.id) l.col = { k: 'prop', id: prop.id }; });
    if (p.escrow > 0) { G.hold += p.escrow; p.escrow = 0; }
    G.projs = G.projs.filter(x => x !== p);
    const v = propValue(prop);
    addDecision({ title: `Livraison — ${p.name}`, text: `Votre programme est livré. Prix de revient : ${eur(prop.cost)}. Valeur de marché estimée : ${eur(v)} (marge potentielle ${pct(v / prop.cost - 1)}). Que faites-vous ?`, choices: [{ l: `Vendre en bloc à un investisseur (${eur(v * .88)}, immédiat)`, k: 'sell_bloc', a: { p: prop.id } }, { l: 'Vente au détail (prix plein, sur plusieurs mois)', k: 'sell_retail', a: { p: prop.id } }, { l: 'Conserver et mettre en location', k: 'ok' }] });
  }
}

function stepSales() {
  const heat = clamp(G.eco.conf * (1.3 - G.eco.ecb * 10) * (shock('immo') ? .5 : 1), .2, 1.6);
  for (const p of [...G.props]) {
    if (!p.sale) continue;
    let sold = 0; for (let i = 0; i < p.sale.left; i++) if (R() < .012 * heat) sold++;
    if (!sold) continue;
    const share = sold / p.sale.left;
    const value = propValue(p) * share, fees = value * .03;
    const basis = p.cost * share, C = CO(CITY[p.city].c);
    repayLoansOn({ k: 'prop', id: p.id }, share);
    G.hold += value - fees;
    G.tb[CITY[p.city].c] = (G.tb[CITY[p.city].c] || 0) + (value - fees - basis);
    p.cost -= basis; p.m2 = Math.round(p.m2 * (1 - share)); p.sale.left -= sold; p.sale.done += sold;
    if (p.sale.left <= 0 || p.m2 < 10) { G.props = G.props.filter(x => x !== p); news('good', `🏠 ${p.name} : tous les lots sont vendus.`); }
  }
}

function stepRivals() {
  const ph = PH[G.eco.phase];
  for (const r of G.rivals) {
    const mu = r.mu + ph.mu * .4;
    r.nw *= Math.exp((mu - r.sig * r.sig / 2) / 365 + r.sig * gauss() / Math.sqrt(365));
    if (R() < .0006) { const up = R() < .55; r.nw *= up ? rnd(1.2, 1.6) : rnd(.3, .7); news(up ? 'info' : 'info', up ? `📈 ${r.n} réalise une opération spectaculaire (${CITY[r.c].n}).` : `📉 ${r.n} essuie de lourdes pertes après un mauvais investissement.`); }
  }
}

function dailyMacro() {
  const e = G.eco, ph = PH[e.phase];
  const confT = ph.conf * (shock('pandemie') ? .8 : 1) * (shock('energie') ? .95 : 1);
  e.conf += (confT - e.conf) * .02 + gauss() * .003;
  e.gdp += (ph.gdp - e.gdp) * .02;
  e.shocks = e.shocks.filter(s => s.until > G.day);
}

function nextDay() {
  if (!G || G.over) return false;
  if (G.pending.length) return false;
  G.day++;
  const dt = dateOf(G.day);
  dailyMacro(); stepMarkets();
  for (const b of G.biz) stepBiz(b);
  for (const p of [...G.projs]) stepProj(p);
  stepSales(); stepRivals();
  // luxe
  for (const x of G.lux) { const L = LUX[x.i]; x.v *= Math.exp(L.g / 365 + (L.vol || .03) * gauss() / Math.sqrt(365)); }
  // intérêts
  if (G.hold < 0) { const it = -G.hold * (euribor() + .09) / 365; G.hold -= it; G.tb[G.holdC] = (G.tb[G.holdC] || 0) - it; }
  else { const it = G.hold * Math.max(0, G.eco.ecb - .005) / 365; G.hold += it; G.tb[G.holdC] = (G.tb[G.holdC] || 0) + it; }
  // exécutifs (salaires quotidiens)
  for (const k in G.execs) { const x = G.execs[k]; const c = x.sal * (1 + CO(G.holdC).cs) / 365; G.hold -= c; G.tb[G.holdC] = (G.tb[G.holdC] || 0) - c; }
  if (dt.getUTCDate() === 1) monthly();
  if (dt.getUTCDay() === 1) weekly();
  if (G.day % 7 === 0) { G.nwh.push([G.day, Math.round(netWorth())]); if (G.nwh.length > 800) G.nwh.shift(); }
  checkSolvency();
  return true;
}

function weekly() {
  // renouvellement des opportunités
  G.listings = G.listings.filter(L => {
    if (L.exp <= G.day) { if (R() < .3) news('info', `🤝 ${pick(G.rivals).n} a racheté « ${L.kind === 'biz' ? L.b.name : L.kind === 're' ? L.p.name : L.name} » à ${CITY[L.city].n}.`); return false; }
    return true;
  });
  for (const c of CITIES) { const n = G.listings.filter(L => L.city === c.id).length; if (n < 4 && R() < .6) G.listings.push(genListing(c.id)); }
}

function monthly() {
  const e = G.eco, dt = dateOf(G.day), m = dt.getUTCMonth();
  // 1. économie : changement de phase
  const nx = PH[e.phase].next; let r = R(), acc = 0; for (const k in nx) { acc += nx[k]; if (r < acc) { if (k !== e.phase) news('info', `📊 Conjoncture : l'économie européenne passe en phase « ${PH[k].n} ».`, k === 'recession' || k === 'boom'); e.phase = k; break; } }
  const inflT = .02 + (e.gdp - .015) * .5 + (shock('energie') ? .025 : 0);
  e.infl += (inflT - e.infl) * .15 + gauss() * .002;
  G.costIdx *= 1 + e.infl / 12;
  // BCE
  const old = e.ecb;
  if (e.infl > .026 && e.phase !== 'recession' && R() < .55) e.ecb += .0025;
  else if ((e.infl < .016 || e.phase === 'recession') && R() < .55) e.ecb -= .0025;
  e.ecb = clamp(e.ecb, 0, .065);
  if (e.ecb !== old) news('info', `🏛️ La BCE ${e.ecb > old ? 'relève' : 'abaisse'} son taux directeur à ${pct(e.ecb, 2)}.`);
  // immobilier
  for (const c of CITIES) {
    const mom = G.rmH[c.id].length > 3 ? (G.rm[c.id] / G.rmH[c.id][G.rmH[c.id].length - 4] - 1) / 3 * .3 : 0;
    G.rm[c.id] *= 1 + .0025 + (e.gdp - .015) * .06 - (e.ecb - .02) * .12 + mom + gauss() * .006 - (shock('immo') ? .012 : 0);
    G.rmH[c.id].push(+G.rm[c.id].toFixed(4)); if (G.rmH[c.id].length > 120) G.rmH[c.id].shift();
  }
  // 2. événements macro
  if (R() < (e.phase === 'boom' ? .03 : .012)) { e.crash = ri(12, 25); news('bad', '💥 KRACH BOURSIER : panique sur les marchés européens.', true); e.conf -= .08; }
  if (R() < .006) { e.shocks.push({ k: 'immo', until: G.day + ri(240, 540) }); news('bad', '🏚️ Crise immobilière : les banques durcissent leurs conditions (LTV −10 pts), les prix reculent.', true); }
  if (R() < .0025) { e.shocks.push({ k: 'pandemie', until: G.day + ri(90, 200) }); news('bad', '🦠 PANDÉMIE : fermeture des établissements de nuit, chute du tourisme. Activité partielle financée par les États.', true); }
  if (R() < .01) { e.shocks.push({ k: 'energie', until: G.day + ri(120, 300) }); news('bad', '⛽ Choc énergétique : coûts d\'exploitation +3 pts, inflation en hausse.'); }
  if (R() < .012) { e.shocks.push({ k: 'tourisme', until: G.day + ri(120, 240) }); news('good', '✈️ Boom touristique en Europe : hôtels, yachts et clubs profitent de l\'afflux.'); }
  if (R() < .025) taxReform();
  if (R() < .01) { const c = pick(Object.keys(COUNTRIES)); G.spreadAdj[c] = (G.spreadAdj[c] || 0) + .01; news('bad', `🗳️ Instabilité politique en ${CO(c).n} : la prime de risque des banques augmente d'1 point.`); }
  for (const c in G.spreadAdj) G.spreadAdj[c] *= .93;
  // 3. loyers
  for (const p of G.props) {
    if (p.sale) continue;
    const C = CO(CITY[p.city].c);
    const tgt = (p.type === 'bureaux' && ['recession', 'ralent'].includes(e.phase)) ? .78 : p.type === 'studios' ? (m === 8 ? 1 : .93) : .94;
    p.occ = clamp(p.occ + (tgt - p.occ) * .3 + gauss() * .03, .4, 1);
    if (p.squat && G.day >= p.squat) { p.squat = 0; news('good', `🏠 ${p.name} : les occupants illégaux ont été expulsés.`); }
    const net = propNetMonthly(p);
    G.hold += net; G.tb[CITY[p.city].c] = (G.tb[CITY[p.city].c] || 0) + net; p.last = net;
    p.cond = Math.max(30, p.cond - .25);
    if (!p.squat && ['logements', 'studios', 'luxe'].includes(p.type) && R() < .004 * (C === CO('FR') ? 3 : 1)) {
      addDecision({ title: `Occupation illégale — ${p.name}`, text: `Des occupants sans droit ni titre se sont installés dans ${p.name}. ${CITY[p.city].c === 'FR' ? 'En France, la procédure peut durer de 4 à 12 mois (trêve hivernale).' : ''}`, choices: [{ l: 'Lancer la procédure judiciaire (8 k€, loyers suspendus plusieurs mois)', k: 'squat_law', a: { p: p.id } }, { l: 'Négocier un départ amiable (35 k€)', k: 'squat_pay', a: { p: p.id } }] });
    }
    if (R() < .02) { const c = propValue(p) * rnd(.002, .01); G.hold -= c; news('bad', `🚿 Sinistre (dégât des eaux / toiture) sur ${p.name} : ${eur(c)} de travaux.`); }
  }
  // 4. échéances de prêts
  for (const l of [...G.loans]) payLoan(l);
  // 5. impôt sur les sociétés (mois précédent)
  corpTax();
  // 6. valorisations des entreprises
  for (const b of G.biz) {
    const t = trailing(b, 180); if (!t) continue;
    const S = SECTORS[b.sector], e12 = t.eb / t.n * 365;
    const tgt = Math.max(b.floor || 0, e12 * S.mult * clamp(Math.pow(e.conf, 1.5), .7, 1.25));
    b.val += (tgt - b.val) * .3;
  }
  // 7. train de vie, résidence, luxe
  const ci = CITY[G.resCity];
  const ownsHome = G.lux.some(x => LUX[x.i].city === G.resCity);
  const life = 9000 + (ownsHome ? 0 : ci.m2 * .45) + G.lux.reduce((a, x) => a + (LUX[x.i].up || 0), 0);
  G.perso -= life; G.lastLife = life;
  // 8. score de crédit
  const late = G.loans.some(l => l.missed > 0);
  if (!late && G.hold > -overdraftLimit()) G.score = Math.min(900, G.score + (monthlyIncome() > 0 ? 4 : 1));
  if (G.hold < 0) G.score = Math.max(300, G.score - 3);
  // 9. candidats
  if (m % 2 === 0) Object.keys(EXECS).forEach(k => { if (R() < .5) genExecCands(k); });
  // 10. fiscalité annuelle
  if (m === 0) yearly();
  // 11. contrôle fiscal
  const fiscAgg = G.execs.fisc && G.execs.fisc.trait === 'Agressif';
  if (G.day > 200 && R() < .025 * (fiscAgg ? 3 : 1)) {
    const base = Math.max(50000, G.taxHist.slice(-12).reduce((a, x) => a + x, 0));
    const amt = base * rnd(.08, .35) * (fiscAgg ? 2 : 1);
    addDecision({ title: 'Contrôle fiscal', text: `L'administration fiscale notifie un redressement de ${eur(amt)} sur votre holding${fiscAgg ? ' (montages d\'optimisation jugés abusifs)' : ''}.`, choices: [{ l: `Accepter et payer (${eur(amt)})`, k: 'tax_pay', a: { amt } }, { l: `Contester au tribunal (${pct(.35 + (G.execs.jur ? G.execs.jur.skill / 200 : 0), 0)} de chances, sinon +40 % de pénalités)`, k: 'tax_fight', a: { amt } }] });
  }
  // perso négatif → dividende automatique
  if (G.perso < 0 && G.hold > -G.perso * 1.5) { const need = -G.perso / (1 - divTaxRate()) + 1; payDividend(need, true); }
  // Monaco
  if (CITY[G.resCity].c === 'MC' && G.monacoDep < 500000) news('bad', '⚠️ Votre dépôt bancaire monégasque est inférieur à 500 k€ : votre carte de résident est menacée.');
}

function yearly() {
  const c = ptc(), C = CO(c);
  let wt = 0;
  if (C.wt) {
    let base = C.wt.re ? reNetValue() : netWorth(), th = C.wt.th, r = C.wt.r;
    if (c === 'ES' && G.resCity === 'madrid') { th = 3e6; r = .017; }
    wt = Math.max(0, base - th) * r;
  }
  if (c === 'IT' && G.flatIT) wt += CO('IT').flat;
  if (wt > 0) {
    G.perso -= wt; G.ytd.wealth += wt; G.tot.wealth += wt;
    news('info', `🧾 ${c === 'FR' ? 'IFI' : c === 'IT' ? 'Forfait fiscal italien' : 'Impôt sur la fortune'} (${C.n}) : ${eur(wt)} prélevés sur votre compte personnel.`);
  }
  G.ytdPrev = G.ytd; G.ytd = { is: 0, div: 0, wealth: 0, other: 0, divPaid: 0 };
}
function reNetValue() {
  let v = 0; for (const p of G.props) v += propValue(p) - loansOn({ k: 'prop', id: p.id });
  for (const x of G.lux) if (LUX[x.i].city) v += x.v;
  return Math.max(0, v);
}
function taxReform() {
  const c = pick(Object.keys(COUNTRIES)), C = CO(c);
  const opts = [
    () => { const d = pick([-.02, -.01, .01, .02, .03]); C.is = clamp(C.is + d, 0, .4); return `l'impôt sur les sociétés passe à ${pct(C.is)}`; },
    () => { const d = pick([-.03, .02, .04]); C.div = clamp(C.div + d, 0, .45); return `la fiscalité des dividendes passe à ${pct(C.div)}`; },
    () => { const d = pick([-.02, .01, .02]); C.mut = clamp(C.mut + d, 0, .15); return `les droits de mutation immobiliers passent à ${pct(C.mut)}`; },
    () => { const d = pick([-.02, .02]); C.cs = clamp(C.cs + d, 0, .5); return `les charges patronales passent à ${pct(C.cs)}`; },
  ];
  if (c === 'MC') return;
  news('info', `📜 Réforme fiscale en ${C.f} ${C.n} : ${pick(opts)()}.`);
}

function payLoan(l) {
  if (!G.loans.includes(l)) return;
  if (!l.fixed) l.rate = Math.max(.005, euribor() + l.margin);
  const interest = l.rem * l.rate / 12;
  let pay = loanPaymentMonthly(l);
  if (LOANT[l.type].inFine && l.left <= 1) pay = interest + l.rem;
  if (G.hold - pay < -overdraftLimit()) {
    l.missed++; G.missedTotal++; G.score = Math.max(300, G.score - 60);
    const pen = pay * .03; G.hold -= pen;
    news('bad', `❌ Échéance impayée sur « ${l.label} » (${eur(pay)}). Pénalités ${eur(pen)}. Impayés consécutifs : ${l.missed}/3.`, true);
    if (l.missed >= 3) defaultLoan(l);
    return;
  }
  G.hold -= pay; l.missed = 0;
  G.tb[l.country] = (G.tb[l.country] || 0) - interest;
  l.rem -= pay - interest; l.left--;
  if (l.left <= 0 || l.rem < 1) { G.loans = G.loans.filter(x => x !== l); news('good', `✅ Prêt soldé : ${l.label}.`); }
  // appel de marge lombard
  if (l.type === 'lomb' && G.loans.includes(l)) {
    const pv = portValue();
    if (l.rem > pv * .75) {
      const need = l.rem - pv * .6; sellPortfolioValue(need);
      repayLoan(l, Math.min(need, l.rem), true);
      news('bad', `📉 Appel de marge sur votre crédit lombard : ${eur(need)} de titres vendus d'office.`, true);
    }
  }
}
function defaultLoan(l) {
  G.score = Math.max(300, G.score - 150);
  let txt = `⛔ DÉFAUT DE PAIEMENT sur « ${l.label} ». `;
  if (l.col && l.col.k !== 'none') {
    const v = collateralValue(l.col) * .7;
    seizeAsset(l.col, v);
    const cover = Math.min(v, l.rem);
    l.rem -= cover; G.hold += v - cover;
    txt += `La banque saisit la garantie et la vend aux enchères pour ${eur(v)}. `;
  }
  if (l.rem > 1) { txt += `Reste dû ${eur(l.rem)} : exigible immédiatement (caution personnelle). `; const fromP = Math.min(Math.max(0, G.perso), l.rem); G.perso -= fromP; l.rem -= fromP; G.hold -= l.rem; }
  G.loans = G.loans.filter(x => x !== l);
  news('bad', txt, true);
}
function seizeAsset(col) {
  if (col.k === 'biz') G.biz = G.biz.filter(b => b.id !== col.id);
  if (col.k === 'prop') G.props = G.props.filter(p => p.id !== col.id);
  if (col.k === 'proj') G.projs = G.projs.filter(p => p.id !== col.id);
  if (col.k === 'port') G.port = {};
}
function sellPortfolioValue(v) {
  for (const t in G.port) {
    if (v <= 0) break; const s = G.stocks.find(x => x.t === t), h = G.port[t];
    const q = Math.min(h.q, Math.ceil(v / s.p)); tradeStock(t, -q, true); v -= q * s.p;
  }
}

function corpTax() {
  let total = 0; const fiscB = G.execs.fisc ? (G.execs.fisc.trait === 'Agressif' ? .15 : G.execs.fisc.skill / 1000) : 0;
  for (const c in G.tb) {
    const base = G.tb[c] + (G.carry[c] || 0);
    if (base > 0) { const t = base * CO(c).is * (1 - fiscB); total += t; G.carry[c] = 0; }
    else G.carry[c] = base;
  }
  G.tb = {};
  if (total > 0) { G.hold -= total; G.ytd.is += total; G.tot.is += total; news('info', `🧾 Impôt sur les sociétés du mois : ${eur(total)}.`); }
  G.taxHist.push(total); if (G.taxHist.length > 36) G.taxHist.shift();
}

function checkSolvency() {
  const lim = overdraftLimit();
  if (G.hold < -lim) {
    G.odDays++;
    if (G.odDays === 1) news('bad', `⚠️ Votre holding dépasse son découvert autorisé (${eur(lim)}). La banque vous laisse 30 jours pour régulariser.`, true);
    if (G.odDays >= 30) {
      G.odDays = 0; G.score = Math.max(300, G.score - 80);
      if (!forcedLiquidation()) {
        const need = -G.hold - lim;
        if (G.perso > 0) { const x = Math.min(G.perso, need); G.perso -= x; G.hold += x; news('bad', `🔒 Caution personnelle actionnée : ${eur(x)} prélevés sur votre compte personnel.`); }
        else if (G.lux.length) { const it = G.lux.sort((a, b) => b.v - a.v)[0]; G.hold += it.v * .7; G.lux = G.lux.filter(x => x !== it); news('bad', `🔒 Saisie personnelle : votre ${LUX[it.i].n} est vendu aux enchères pour ${eur(it.v * .7)}.`); }
        else if (G.hold < -lim) { gameOver('Liquidation judiciaire : votre holding ne peut plus honorer ses dettes et vous n\'avez plus d\'actifs à céder.'); }
      }
    }
  } else G.odDays = 0;
  if (netWorth() < -1e5 && G.hold < 0 && !G.biz.length && !G.props.length && !G.projs.length) gameOver('Faillite : votre patrimoine net est négatif et vous n\'avez plus aucune source de revenus.');
}
function forcedLiquidation() {
  const assets = [];
  if (portValue() > 0) assets.push({ k: 'port', v: portValue() });
  G.biz.forEach(b => assets.push({ k: 'biz', id: b.id, v: bizValue(b), n: b.name }));
  G.props.forEach(p => assets.push({ k: 'prop', id: p.id, v: propValue(p), n: p.name }));
  if (!assets.length) return false;
  assets.sort((a, b) => a.v - b.v);
  const need = -G.hold; const a = assets.find(x => x.v >= need * .5) || assets[assets.length - 1];
  if (a.k === 'port') { sellPortfolioValue(a.v); news('bad', `🔒 Liquidation forcée de votre portefeuille boursier par la banque.`, true); return true; }
  const price = a.v * .7;
  repayLoansOn({ k: a.k, id: a.id });
  seizeAsset({ k: a.k, id: a.id }); G.hold += price;
  news('bad', `🔒 Vente forcée par la banque : ${a.n} cédé à prix cassé (${eur(price)}).`, true);
  return true;
}
function gameOver(msg) { G.over = true; G.overMsg = msg; news('bad', '☠️ ' + msg); }

   ACTIONS DU JOUEUR

function payDividend(amount, auto) {
  amount = Math.min(amount, Math.max(0, G.hold));
  if (amount <= 0) return 0;
  const tr = divTaxRate(), tax = amount * tr;
  G.hold -= amount; G.perso += amount - tax; G.ytd.div += tax; G.tot.div += tax; G.ytd.divPaid += amount;
  news('info', `💶 ${auto ? 'Dividende automatique (train de vie)' : 'Dividende versé'} : ${eur(amount)} brut, impôt ${eur(tax)} (${pct(tr)} — ${CO(ptc()).n}), net ${eur(amount - tax)}.`);
  return amount - tax;
}
function contribute(amount) { amount = Math.min(amount, G.perso); if (amount <= 0) return; G.perso -= amount; G.hold += amount; G.contrib += amount; news('info', `💼 Apport en compte courant d'associé : ${eur(amount)} vers la holding.`); }

function tradeStock(t, q, forced) {
  const s = G.stocks.find(x => x.t === t); if (!s || !q) return false;
  const val = Math.abs(q) * s.p, fee = Math.max(10, val * .0015);
  if (q > 0) {
    if (G.hold - val - fee < 0 && !forced) return false;
    G.hold -= val + fee; const h = G.port[t] || (G.port[t] = { q: 0, cost: 0 }); h.cost += val + fee; h.q += q;
  } else {
    const h = G.port[t]; if (!h) return false; q = Math.min(-q, h.q);
    const v = q * s.p, basis = h.cost * q / h.q;
    G.hold += v - fee; h.cost -= basis; h.q -= q;
    G.tb[G.holdC] = (G.tb[G.holdC] || 0) + (v - fee - basis);
    if (h.q <= 0) delete G.port[t];
  }
  return true;
}

function acquireListing(L, fin) {
  const ci = CITY[L.city], C = CO(ci.c);
  if (L.kind === 'biz') {
    const tax = L.price * C.fmut, total = L.price + tax + 5000;
    const q = fin && fin.amount > 0 ? loanQuote({ type: 'biz', amount: fin.amount, months: fin.months, fixed: fin.fixed, value: L.price, income: L.estE, country: ci.c }) : null;
    if (q && !q.ok) return 'Financement refusé';
    const loanAmt = q ? fin.amount : 0;
    if (G.hold + loanAmt - (q ? q.fees : 0) < total) return 'Trésorerie insuffisante pour l\'apport';
    const b = L.b; b.cost = L.price; b.bought = G.day; b.floor = (250000 * b.size * cityPrice(ci)) * .5; b.h = [];
    G.hold -= total; G.tb[ci.c] = (G.tb[ci.c] || 0) - tax;
    G.biz.push(b);
    if (q) createLoan({ type: 'biz', amount: loanAmt, months: fin.months, col: { k: 'biz', id: b.id }, country: ci.c }, q, `Acquisition ${b.name}`);
    news('good', `🖊️ Acquisition de ${b.name} (${ci.n}) pour ${eur(L.price)} + ${eur(tax)} de droits.`);
  } else if (L.kind === 're') {
    const tax = L.price * C.mut, total = L.price + tax;
    const p = L.p;
    const value = propValue(p);
    const q = fin && fin.amount > 0 ? loanQuote({ type: 're', amount: fin.amount, months: fin.months, fixed: fin.fixed, value: Math.min(value, L.price), income: propNetMonthly(p), country: ci.c }) : null;
    if (q && !q.ok) return 'Financement refusé';
    const loanAmt = q ? fin.amount : 0;
    if (G.hold + loanAmt - (q ? q.fees : 0) < total) return 'Trésorerie insuffisante pour l\'apport';
    p.cost = total; p.bought = G.day;
    G.hold -= total; G.props.push(p);
    if (q) createLoan({ type: 're', amount: loanAmt, months: fin.months, col: { k: 'prop', id: p.id }, country: ci.c }, q, `Hypothèque ${p.name}`);
    news('good', `🖊️ Acquisition de ${p.name} (${p.m2.toLocaleString('fr-FR')} m²) pour ${eur(L.price)} + ${eur(tax)} de droits de mutation.`);
  } else {
    const type = fin.ptype, tax = L.price * C.mut;
    const { build } = landRef(ci, type, L.m2);
    const total = L.price + tax + build;
    const q = fin.amount > 0 ? loanQuote({ type: 'promo', amount: fin.amount, months: fin.months, fixed: fin.fixed, value: total, country: ci.c, extraCost: build }) : null;
    if (q && !q.ok) return 'Financement refusé';
    const loanAmt = q ? fin.amount : 0;
    const escrow = Math.max(0, loanAmt - (L.price + tax));
    const cashNeed = Math.max(0, L.price + tax - loanAmt) + (q ? q.fees : 0);
    if (G.hold < cashNeed) return 'Trésorerie insuffisante pour l\'apport';
    const permDays = Math.round(120 * C.bur * (G.execs.jur ? .7 : 1) * rnd(.8, 1.3));
    const p = { id: uid(), type, city: L.city, m2: L.m2, name: `${RT[type].n} « ${L.name.split('— ')[1] || ci.n} », ${ci.n}`, phase: 'permis', t0: G.day, end: G.day + permDays, landCost: L.price + tax, budget: build, spent: 0, over: 0, escrow: 0 };
    G.projs.push(p);
    if (q) { const l = createLoan({ type: 'promo', amount: loanAmt, months: fin.months, col: { k: 'proj', id: p.id }, country: ci.c }, q, `Crédit promoteur ${p.name}`); G.hold -= loanAmt; }
    G.hold -= Math.max(0, L.price + tax - loanAmt); p.escrow = escrow;
    news('good', `🖊️ Achat du terrain (${L.m2.toLocaleString('fr-FR')} m² constructibles) à ${ci.n} pour ${eur(L.price)}. Dépôt du permis de construire : décision attendue sous ~${permDays} jours.`);
  }
  G.listings = G.listings.filter(x => x !== L);
  G.stats.bought++;
  return null;
}

function sellBiz(b, price) {
  const ci = CITY[b.city];
  repayLoansOn({ k: 'biz', id: b.id });
  const fees = price * .04; G.hold += price - fees;
  G.tb[ci.c] = (G.tb[ci.c] || 0) + (price - fees - b.cost - fleetValue(b) * 0);
  G.biz = G.biz.filter(x => x !== b);
  news('good', `🤝 Cession de ${b.name} pour ${eur(price)} (frais ${eur(fees)}).`);
}
function sellProp(p, mode) {
  const ci = CITY[p.city];
  if (mode === 'bloc') {
    const price = propValue(p) * .88, fees = price * .02;
    repayLoansOn({ k: 'prop', id: p.id }); G.hold += price - fees;
    G.tb[ci.c] = (G.tb[ci.c] || 0) + (price - fees - p.cost);
    G.props = G.props.filter(x => x !== p);
    news('good', `🏢 ${p.name} vendu en bloc pour ${eur(price)}.`);
  } else {
    const lots = Math.max(2, Math.round(p.m2 / 65));
    p.sale = { lots, left: lots, done: 0, start: G.day };
    news('info', `🏷️ ${p.name} mis en vente au détail : ${lots} lots.`);
  }
}

/* ---------------- Résolution des décisions */
const DEC = {
  ok: () => { },
  greve_ok: a => { const b = G.biz.find(x => x.id === a.b); if (b) { b.raise = (b.raise || 1) * 1.04; news('info', `Accord salarial à ${b.name} : +4 %.`); } },
  greve_no: a => { const b = G.biz.find(x => x.id === a.b); if (b) { const d = ri(4, 12); b.closedUntil = G.day + d; b.rep -= 5; news('bad', `Grève à ${b.name} : ${d} jours de fermeture.`); } },
  fraud_sue: a => { const b = G.biz.find(x => x.id === a.b); if (b) b.dir = null; G.hold -= 15000; if (R() < .4) { G.hold += a.amt / 2; news('good', `Le tribunal vous restitue ${eur(a.amt / 2)}.`); } else news('bad', 'La procédure n\'a rien permis de récupérer.'); },
  fraud_fire: a => { const b = G.biz.find(x => x.id === a.b); if (b) b.dir = null; },
  sell_offer: a => { const b = G.biz.find(x => x.id === a.b); if (b) sellBiz(b, a.offer); },
  permit_appeal: a => { const p = G.projs.find(x => x.id === a.p); if (!p) return; G.hold -= 50000; if (R() < .6 + (G.execs.jur ? .15 : 0)) { p.phase = 'permis'; p.appeal = true; p.end = G.day + 120; news('good', `Recours accepté pour ${p.name} : instruction relancée.`); } else { news('bad', `Recours rejeté pour ${p.name}. Terrain revendu.`); DEC.permit_quit(a); } },
  permit_quit: a => { const p = G.projs.find(x => x.id === a.p); if (!p) return; const v = p.landCost * .85; repayLoansOn({ k: 'proj', id: p.id }); G.hold += v + (p.escrow || 0); G.tb[CITY[p.city].c] = (G.tb[CITY[p.city].c] || 0) - (p.landCost - v); G.projs = G.projs.filter(x => x !== p); news('info', `Terrain revendu ${eur(v)}.`); },
  sell_bloc: a => { const p = G.props.find(x => x.id === a.p); if (p) sellProp(p, 'bloc'); },
  sell_retail: a => { const p = G.props.find(x => x.id === a.p); if (p) sellProp(p, 'retail'); },
  squat_law: a => { const p = G.props.find(x => x.id === a.p); if (!p) return; G.hold -= 8000; p.squat = G.day + Math.round((CITY[p.city].c === 'FR' ? ri(120, 365) : ri(45, 150)) * (G.execs.jur ? .7 : 1)); },
  squat_pay: a => { G.hold -= 35000; news('info', 'Départ négocié des occupants.'); },
  tax_pay: a => { G.hold -= a.amt; G.ytd.other += a.amt; G.tot.other += a.amt; },
  tax_fight: a => { G.hold -= 40000; if (R() < .35 + (G.execs.jur ? G.execs.jur.skill / 200 : 0)) news('good', '⚖️ Victoire au tribunal administratif : redressement annulé.'); else { const x = a.amt * 1.4; G.hold -= x; G.ytd.other += x; G.tot.other += x; news('bad', `⚖️ Défaite au tribunal : ${eur(x)} à payer (pénalités incluses).`); } },
};
function resolveDecision(id, idx) {
  const d = G.pending.find(x => x.id === id); if (!d) return;
  const c = d.choices[idx]; G.pending = G.pending.filter(x => x !== d);

}

      }
      s += `<text x="12" y="24" ${F} font-weight="700" font-size="15" fill="#fff">${esc(label)}</text>`;
      break;
    }
    case 'cardealer': {
      const c = `hsl(${[0, 50, 210, 0, 120][Math.floor(r() * 5)]},75%,${r() < .3 ? 15 : 45}%)`;
      s += sky('#8cc0ef', '#e4f1ff') + city(6, 160, true) + `<rect y="190" width="400" height="35" fill="#a7adb5"/>`;
      s += `<rect x="40" y="70" width="320" height="120" fill="#bcd8ee" opacity=".85" stroke="#6d7c8b" stroke-width="2"/>`;
      for (let i = 1; i < 6; i++) s += `<line x1="${40 + i * 53}" y1="70" x2="${40 + i * 53}" y2="190" stroke="#6d7c8b" stroke-width="2"/>`;
      s += `<rect x="40" y="52" width="320" height="22" fill="#20262e"/><text x="200" y="68" text-anchor="middle" ${F} font-weight="600" font-size="13" fill="#e8c46a" letter-spacing="1.5">${esc(label.toUpperCase())}</text>`;
      s += `<g transform="translate(110,140)"><path d="M0 38 Q4 20 30 16 L70 2 Q110 -6 140 10 L178 18 Q190 22 190 38 Z" fill="${c}"/><path d="M62 8 L76 -1 Q105 -6 128 8 Z" fill="#26313c"/><circle cx="42" cy="40" r="11" fill="#111"/><circle cx="42" cy="40" r="5" fill="#999"/><circle cx="150" cy="40" r="11" fill="#111"/><circle cx="150" cy="40" r="5" fill="#999"/></g>`;
      for (const x of [20, 380]) s += `<line x1="${x}" y1="190" x2="${x}" y2="40" stroke="#777" stroke-width="2"/><rect x="${x}" y="40" width="${x < 200 ? 22 : -22}" height="30" fill="${c}"/>`;

    }
    case 'hotel': {

      const fl = 6, base = `hsl(${30 + r() * 20},${25 + r() * 15}%,${78 + r() * 8}%)`;
      s += `<rect x="70" y="30" width="260" height="165" fill="${base}"/><rect x="62" y="24" width="276" height="10" fill="#6b5d4a"/>`;

      s += `<path d="M160 172 H240 L250 185 H150Z" fill="#7a1e2c"/><rect x="180" y="185" width="40" height="10" fill="#3b2f25"/>`;
      s += `<text x="200" y="20" text-anchor="middle" ${F} font-weight="700" font-size="14" fill="#2b2b2b">${esc(label)} ★★★★★</text>`;
      for (const x of [95, 305]) s += `<line x1="${x}" y1="34" x2="${x}" y2="6" stroke="#555"/><rect x="${x}" y="6" width="16" height="10" fill="#1f4e8c"/>`;
      s += people(4, 196);
      break;
    }
    default: { // immobilier
      const prog = o.prog == null ? 1 : o.prog;
      s += sky('#90c2ee', '#e6f2fc') + city(6, 170, true) + `<rect y="190" width="400" height="35" fill="#95a0aa"/>`;
      if (kind === 'luxe') {
        s += `<rect x="40" y="150" width="320" height="40" fill="#4aa3d8"/><rect x="40" y="150" width="320" height="6" fill="#e9f6ff" opacity=".6"/>`;
        s += `<rect x="90" y="${150 - 90 * prog}" width="220" height="${90 * prog}" fill="#f8f6f1"/>`;
        if (prog >= 1) { for (let i = 0; i < 6; i++) s += `<rect x="${100 + i * 35}" y="78" width="25" height="28" fill="#2e4b62"/><rect x="${100 + i * 35}" y="114" width="25" height="30" fill="#2e4b62"/>`; s += `<rect x="80" y="62" width="240" height="8" fill="#e3dfd5"/>`; }
        for (const x of [55, 345]) s += `<rect x="${x - 3}" y="90" width="6" height="60" fill="#7b5a3a"/><path d="M${x} 90 q-25 -5 -35 10 M${x} 90 q25 -5 35 10 M${x} 90 q-12 -20 -28 -18 M${x} 90 q12 -20 28 -18" stroke="#2f7d3b" stroke-width="5" fill="none"/>`;
      } else {
        const tall = kind === 'bureaux' ? 150 : kind === 'commerce' ? 70 : 120, w = kind === 'bureaux' ? 140 : 220, x0 = 200 - w / 2;
        const h = tall * prog, col = kind === 'bureaux' ? '#7fb0d6' : kind === 'studios' ? `hsl(${(r() * 360).toFixed(0)},45%,70%)` : kind === 'commerce' ? '#e7d8c3' : '#e9e2d6';
        s += `<rect x="${x0}" y="${190 - h}" width="${w}" height="${h}" fill="${col}"/>`;
        const rows = Math.floor(h / 18), cols = Math.floor(w / 24);
        for (let f = 0; f < rows; f++) for (let i = 0; i < cols; i++) s += `<rect x="${x0 + 8 + i * 24}" y="${190 - h + 6 + f * 18}" width="${kind === 'bureaux' ? 18 : 12}" height="11" fill="${kind === 'bureaux' ? '#cfe6f7' : r() < .5 ? '#ffe6a6' : '#55636f'}" opacity=".9"/>`;
        if (kind === 'commerce') s += `<rect x="${x0}" y="160" width="${w}" height="30" fill="#c43d3d"/>`;
      }
      if (prog < 1) {
        s += `<line x1="330" y1="190" x2="330" y2="25" stroke="#e8b422" stroke-width="5"/><line x1="200" y1="30" x2="380" y2="30" stroke="#e8b422" stroke-width="4"/><line x1="230" y1="30" x2="230" y2="${70 + 60 * prog}" stroke="#333"/><rect x="222" y="${70 + 60 * prog}" width="16" height="10" fill="#777"/>`;
        s += `<rect x="${12}" y="200" width="${(376 * prog).toFixed(0)}" height="8" fill="#e8b422"/><rect x="12" y="200" width="376" height="8" fill="none" stroke="#333"/>`;
      }
      s += `<text x="12" y="22" ${F} font-weight="700" font-size="14" fill="#1d2733">${esc(label)}</text>`;
    }
  }
  return `<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" class="art" role="img" aria-label="${esc(label)}">${s}</svg>`;
}

/* ---------------- graphiques */
function spark(arr, w = 120, h = 30, col) {
  if (!arr || arr.length < 2) return '';
  const mn = Math.min(...arr), mx = Math.max(...arr), d = mx - mn || 1;
  const pts = arr.map((v, i) => [(i / (arr.length - 1)) * w, h - 2 - (v - mn) / d * (h - 4)]);
  const c = col || (arr[arr.length - 1] >= arr[0] ? 'var(--good)' : 'var(--bad)');
  const p = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="spark"><polygon points="0,${h} ${p} ${w},${h}" fill="${c}" opacity=".12"/><polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.5"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${c}"/></svg>`;
}
function bigChart(pts, fmtY) {
  if (pts.length < 2) return '<div class="muted small">Pas encore assez d\'historique : avancez de quelques semaines.</div>';
  const W = 640, H = 200, P = 74, ys = pts.map(p => p[1]); let mn = Math.min(...ys), mx = Math.max(...ys); const pad = (mx - mn) * .08 || Math.abs(mx) * .05 || 1; mn -= pad; mx += pad; const d = mx - mn;
  const X = i => P + (i / (pts.length - 1)) * (W - P - 10), Y = v => H - 22 - (v - mn) / d * (H - 34);
  const poly = pts.map((p, i) => X(i).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = mn + d * k / 4; g += `<line x1="${P}" x2="${W - 10}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${P - 6}" y="${Y(v) + 4}" text-anchor="end" class="ax">${fmtY(v)}</text>`; }
  g += `<text x="${P}" y="${H - 4}" class="ax">${sdate(pts[0][0])}</text><text x="${W - 10}" y="${H - 4}" text-anchor="end" class="ax">${sdate(pts[pts.length - 1][0])}</text>`;
  const l = pts.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}<polygon points="${X(0)},${Y(mn)} ${poly} ${X(l)},${Y(mn)}" fill="var(--accent)" opacity=".1"/><polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${X(l)}" cy="${Y(pts[l][1])}" r="4" fill="var(--accent)"/></svg>`;
}
const bar = (v, max = 100, col) => `<span class="bar"><i style="width:${clamp(v / max * 100, 0, 100)}%;${col ? 'background:' + col : ''}"></i></span>`;
const pill = (t, k) => `<span class="pill ${k || ''}">${t}</span>`;

      <div class="kv"><span>État / réputation</span><b>${b.cond}/100 · ${b.rep}/100</b></div><div class="kv"><span>Direction</span><b>${b.dir ? esc(b.dir.n) + ' (' + b.dir.skill + ')' : '<span class="neg">aucun directeur</span>'}</b></div>

      <div class="kv"><span>Prix demandé</span><b>${eur(l.price)}</b></div><div class="kv"><span>Valeur estimée</span><b>${eur(propValue(p))}</b></div><div class="kv"><span>Loyer net estimé</span><b>${eur(propNetMonthly(p) * 12)}/an</b></div><div class="kv"><span>Rendement net / prix</span><b>${pct(propNetMonthly(p) * 12 / l.price)}</b></div>
      <div class="row"><button class="primary" onclick="A.buy('${l.lid}')">Étudier l'achat</button><span class="muted small">expire ${sdate(l.exp)}</span></div></div>`; }

      <div class="kv"><span>Prix du terrain</span><b>${eur(l.price)}</b></div><div class="kv"><span>Charge foncière</span><b>${Math.round(l.price / l.m2).toLocaleString('fr-FR')} €/m²</b></div>

  };
  const mine = [...G.biz.filter(b => b.city === c.id).map(b => `<li class="click" onclick="A.bizd('${b.id}')">${SECTORS[b.sector].ico} ${esc(b.name)} — ${eur(bizValue(b))}</li>`), ...G.props.filter(p => p.city === c.id).map(p => `<li>${RT[p.type].ico} ${esc(p.name)} — ${eur(propValue(p))}</li>`), ...G.projs.filter(p => p.city === c.id).map(p => `<li>🏗️ ${esc(p.name)} (chantier)</li>`)].join('');

  <div class="grid g3"><section class="card span2"><h2>${C.f} ${c.n} <span class="muted small">${C.n} · ${c.pop.toLocaleString('fr-FR')} M hab.</span></h2>
    <div class="grid g4 tight">
      <div class="stat"><span>Prix / m²</span><b>${Math.round(c.m2 * G.rm[c.id] * fxOf(c.c)).toLocaleString('fr-FR')} €</b>${spark(G.rmH[c.id], 110, 26)}</div>
      <div class="stat"><span>Richesse</span><b>${bar(c.w, 3)}</b></div><div class="stat"><span>Tourisme</span><b>${bar(c.t, 1.7)}</b></div><div class="stat"><span>Vie nocturne</span><b>${bar(c.ni, 1.7)}</b></div>

function countrySheet(k) {
  const C = CO(k);
  return `<table class="t compact">
  <tr><td>Impôt sur les sociétés</td><td class="num">${pct(C.is)}</td></tr><tr><td>Charges patronales</td><td class="num">${pct(C.cs)}</td></tr>
  <tr><td>TVA</td><td class="num">${pct(C.tva)}</td></tr><tr><td>Dividendes (résident)</td><td class="num">${pct(C.div)}</td></tr>
  <tr><td>Impôt sur la fortune</td><td class="num">${C.wt ? pct(C.wt.r) + ' > ' + eur(C.wt.th) : 'aucun'}</td></tr>
  <tr><td>Droits de mutation immo</td><td class="num">${pct(C.mut)}</td></tr><tr><td>Taxe foncière / an</td><td class="num">${pct(C.ptax, 2)}</td></tr>
  <tr><td>Lenteur administrative</td><td class="num">×${C.bur}</td></tr><tr><td>Prime de risque bancaire</td><td class="num">${pct(C.spr + (G.spreadAdj[k] || 0), 2)}</td></tr>

  <tr><td>Devise</td><td class="num">${C.cur}${C.cur !== 'EUR' ? ' (' + (fxOf(k) - 1 >= 0 ? '+' : '') + pct(fxOf(k) - 1) + ')' : ''}</td></tr></table>
  <ul class="notes">${C.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;

/* --- Achat / financement */
function buyHtml() {
  const B = UI.buy, L = G.listings.find(x => x.lid === B.lid); if (!L) return '<p>Offre expirée.</p>';
  const ci = CITY[L.city], C = CO(ci.c);
  let head = '', costs = [], value = L.price, income = 0, type, extra = 0, est = '';
  if (L.kind === 'biz') {
    type = 'biz'; head = `${SECTORS[L.b.sector].ico} ${esc(L.b.name)}`; income = L.estE;
    costs = [['Prix de cession', L.price], [`Droits d'enregistrement (${pct(C.fmut)})`, L.price * C.fmut], ['Honoraires d\'avocats', 5000]];
  } else if (L.kind === 're') {
    type = 're'; head = `${RT[L.p.type].ico} ${esc(L.p.name)}`; income = propNetMonthly(L.p); value = Math.min(L.price, propValue(L.p));
    costs = [['Prix', L.price], [`Droits de mutation (${pct(C.mut)})`, L.price * C.mut]];
  } else {
    type = 'promo'; head = `🏗️ ${esc(L.name)} — ${ci.n}`;
    const { sale, build } = landRef(ci, B.ptype, L.m2); extra = build;
    costs = [['Terrain', L.price], [`Droits de mutation (${pct(C.mut)})`, L.price * C.mut], [`Travaux (${Math.round(build / L.m2).toLocaleString('fr-FR')} €/m², à décaisser)`, build]];
    const tot = costs.reduce((a, c) => a + c[1], 0); value = tot;
    const intEst = B.pct * tot * (G.eco.ecb + .04) * (B.months / 12) * .6;
    est = `<div class="estbox"><div class="kv"><span>Valeur de vente estimée à livraison (prix actuels)</span><b>${eur(sale)}</b></div><div class="kv"><span>Prix de revient (hors frais financiers)</span><b>${eur(tot)}</b></div><div class="kv"><span>Frais financiers estimés</span><b>${eur(intEst)}</b></div><div class="kv"><span>Marge promoteur estimée</span><b class="${cls(sale - tot - intEst)}">${eur(sale - tot - intEst)} (${pct((sale - tot - intEst) / tot)})</b></div><p class="muted small">Délai de permis ~${Math.round(120 * C.bur)} j (bureaucratie ×${C.bur}), risque de refus ~${pct(.1 * C.bur, 0)}, puis ~${Math.round(240 + L.m2 / 25)} j de travaux. Dépassements et retards possibles.</p></div>`;
  }
  const total = costs.reduce((a, c) => a + c[1], 0);
  const amount = Math.round(B.pct * (L.kind === 'land' ? total : L.price) / 1000) * 1000;
  const q = amount > 0 ? loanQuote({ type, amount, months: B.months, fixed: B.fixed, value, income, country: ci.c, extraCost: extra }) : null;
  const cashNow = L.kind === 'land' ? Math.max(0, L.price * (1 + C.mut) - amount) + (q ? q.fees : 0) : total - amount + (q ? q.fees : 0);
  const T = LOANT[type];
  const maxPct = L.kind === 'land' ? .7 : T.ltv;
  return `<h2>${head}</h2>
  <div class="grid g2"><div>
    <h3>Coût de l'opération</h3><table class="t">${costs.map(c => `<tr><td>${c[0]}</td><td class="num">${eur(c[1])}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td class="num">${eur(total)}</td></tr></table>
    ${L.kind === 'land' ? `<label for="b_type">Programme à construire</label><select id="b_type" onchange="A.buyUpd(true)">${L.allowed.map(t => `<option value="${t}"${t === B.ptype ? ' selected' : ''}>${RT[t].n}</option>`).join('')}</select>${est}` : ''}
    ${L.kind === 'biz' ? `<p class="muted small">Le prix tient compte de l'état actuel (EBITDA ${eur(L.estE * 12)}/an) et du potentiel bien géré (${eur((L.estP || 0) * 12)}/an). Pensez à recruter un directeur et à compléter les équipes après le rachat.</p>` : ''}
  </div><div>
    <h3>Financement bancaire — ${T.n}</h3>
    <label for="b_pct">Part financée par la banque : <b>${pct(B.pct, 0)}</b> (${eur(amount)})</label><input type="range" id="b_pct" min="0" max="${maxPct}" step=".05" value="${B.pct}" oninput="A.buyUpd()">
    <div class="row"><div><label for="b_m">Durée</label><select id="b_m" onchange="A.buyUpd()">${(type === 'promo' ? [24, 36, 48] : type === 're' ? [120, 180, 240, 300] : [36, 60, 84, 120]).map(m => `<option value="${m}"${m === B.months ? ' selected' : ''}>${m / 12} ans</option>`).join('')}</select></div>
    <div><label for="b_fx">Taux</label><select id="b_fx" onchange="A.buyUpd()"><option value="1"${B.fixed ? ' selected' : ''}>Fixe</option><option value="0"${!B.fixed ? ' selected' : ''}>Variable (Euribor + marge)</option></select></div></div>
    ${q ? quoteBox(q, amount) : '<p class="muted">Achat 100 % en fonds propres.</p>'}
    <div class="kv big"><span>Trésorerie à mobiliser maintenant</span><b class="${G.hold >= cashNow ? '' : 'neg'}">${eur(cashNow)}</b></div>
    <div class="kv"><span>Trésorerie disponible (holding)</span><b>${eur(G.hold)}</b></div>
  </div></div>
  <div class="row end"><button class="ghost" onclick="closeModal()">Annuler</button><button class="primary" onclick="A.buyGo()" ${(q && !q.ok) || G.hold < cashNow ? 'disabled' : ''}>Signer l'acquisition</button></div>`;
}
function quoteBox(q, amount) {
  const P = q.parts;
  return `<div class="quote ${q.ok ? 'ok' : 'ko'}"><div class="qh">${q.ok ? 'Accord de principe' : 'Refus de la banque'} — taux ${pct(q.rate, 2)} ${q.fixed ? 'fixe' : 'variable'}</div>
  <table class="t compact"><tr><td>Taux de base (${q.fixed ? 'swap + prime de durée' : 'Euribor'})</td><td class="num">${pct(P.base, 2)}</td></tr><tr><td>Marge bancaire</td><td class="num">${pct(P.marge, 2)}</td></tr><tr><td>Prime de risque pays</td><td class="num">${pct(P.pays, 2)}</td></tr><tr><td>Prime emprunteur (score ${G.score})</td><td class="num">${pct(P.risque, 2)}</td></tr><tr><td>Prime de LTV</td><td class="num">${pct(P.ltv, 2)}</td></tr>${P.daf ? `<tr><td>Négociation du DAF</td><td class="num">${pct(P.daf, 2)}</td></tr>` : ''}${P.prive ? `<tr><td>Banque privée (> 20 M€)</td><td class="num">${pct(P.prive, 2)}</td></tr>` : ''}<tr><td>Assurance emprunteur</td><td class="num">${pct(P.assurance, 2)}</td></tr></table>
  <div class="kv"><span>Échéance mensuelle</span><b>${eur(q.pay)}</b></div><div class="kv"><span>Frais de dossier</span><b>${eur(q.fees)}</b></div>${q.dscr != null ? `<div class="kv"><span>Couverture de la dette (DSCR)</span><b class="${q.dscr >= 1.2 ? 'pos' : 'neg'}">${q.dscr.toFixed(2).replace('.', ',')}</b></div>` : ''}
  ${q.reasons.length ? `<ul class="reasons">${q.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}</div>`;
}

/* --- Entreprises */
PAGES.biz = () => {
  if (!G.biz.length) return `<section class="card empty"><h2>Aucune entreprise</h2><p>Parcourez la carte d'Europe pour racheter votre premier établissement : franchise de restauration rapide, club, flotte de yachts, concession automobile ou hôtel.</p><button class="primary" onclick="A.go('monde')">Ouvrir la carte</button></section>`;
  return `<section class="card"><h2>Vos entreprises (${G.biz.length})</h2><div class="bizgrid">${G.biz.map(b => {
    const t = trailing(b, 30), S = SECTORS[b.sector], ci = CITY[b.city];
    return `<div class="bcard click" onclick="A.bizd('${b.id}')">${art(b.sector, b.id, b.name.split(' ' + ci.n)[0], { n: b.fleet.length })}
      <div class="bb"><b>${esc(b.name)}</b><span class="muted small">${CO(ci.c).f} ${ci.n} · ${S.n}</span>
      <div class="kv"><span>EBITDA 30 j</span><b class="${cls(t ? t.eb : 0)}">${t ? eur(t.eb) : '—'}</b></div><div class="kv"><span>Valorisation</span><b>${eur(bizValue(b))}</b></div>
      <div class="row wrap">${b.closedUntil > G.day ? pill('Fermé', 'bad') : pill('Ouvert', 'good')} ${b.dir ? '' : pill('Sans directeur', 'warn')} ${staffFactor(b) < .9 ? pill('Sous-effectif', 'warn') : ''} ${b.cond < 45 ? pill('Vétuste', 'warn') : ''}</div></div></div>`;
  }).join('')}</div></section>`;
};

  const q = quality(b);
  return `<div class="row"><button class="ghost" onclick="A.go('biz')">← Entreprises</button></div>
  <div class="grid g3"><section class="card span2"><div class="hero">${art(b.sector, b.id, b.name.split(' ' + ci.n)[0], { n: b.fleet.length })}</div>
    <h2>${esc(b.name)} <span class="muted small">${S.full} · ${C.f} ${ci.n}${b.sector !== 'yacht' ? ' · taille ' + ['', 'standard', 'grande', 'flagship'][b.size] : ''}</span></h2>
    <div class="grid g4 tight">
      <div class="stat"><span>Qualité opérationnelle</span><b>${(q * 100).toFixed(0)}</b>${bar(q, 1.5)}</div>
      <div class="stat"><span>Réputation</span><b>${b.rep.toFixed(0)}/100</b>${bar(b.rep)}</div>

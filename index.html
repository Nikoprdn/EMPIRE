      <div class="stat"><span>Effectifs</span><b>${(staffFactor(b) * 100).toFixed(0)} %</b>${bar(staffFactor(b), 1.1)}</div>
    </div>
    ${b.closedUntil > G.day ? `<p class="warnline">Établissement fermé jusqu'au ${sdate(b.closedUntil)}.</p>` : ''}
    <h3>EBITDA quotidien — 90 derniers jours</h3>${spark(hist, 600, 60)}
    <div class="grid g2"><div><h3>Compte d'exploitation (projection mensuelle)</h3><table class="t">
      <tr><td>Chiffre d'affaires HT</td><td class="num">${eur(est.net)}</td></tr>
      <tr><td>Achats consommés</td><td class="num neg">${eur(-pl.cogs * k)}</td></tr>${S.royalty ? `<tr><td>Redevance de franchise (${pct(S.royalty, 0)})</td><td class="num neg">${eur(-pl.roy * k)}</td></tr>` : ''}
      <tr><td>Masse salariale chargée</td><td class="num neg">${eur(-pl.staff * k)}</td></tr><tr><td>${b.sector === 'yacht' ? 'Places de port' : 'Loyer'}</td><td class="num neg">${eur(-pl.rent * k)}</td></tr>
      <tr><td>Frais généraux</td><td class="num neg">${eur(-pl.fg * k)}</td></tr>${pl.maint ? `<tr><td>Entretien de la flotte</td><td class="num neg">${eur(-pl.maint * k)}</td></tr>` : ''}<tr><td>Assurance</td><td class="num neg">${eur(-pl.ins * k)}</td></tr>
      <tr class="tot"><td>EBITDA projeté</td><td class="num ${cls(est.eb)}">${eur(est.eb)}</td></tr><tr><td>EBITDA réel 30 j</td><td class="num ${cls(t30 ? t30.eb : 0)}">${t30 ? eur(t30.eb) : '—'}</td></tr></table>
      <p class="muted small">La projection lisse saisonnalité et jours de la semaine sur un an, aux conditions actuelles. Le CA est soumis à la TVA ${C.n} (${pct(C.tva)}) et le résultat à l'IS (${pct(C.is)}).</p></div>
    <div><h3>Pilotage</h3>
      <label>Politique tarifaire</label><div class="seg">${[[.85, 'Agressive'], [1, 'Marché'], [1.2, 'Premium']].map(([v, n]) => `<button class="${b.price === v ? 'on' : ''}" onclick="A.price('${b.id}',${v})">${n}</button>`).join('')}</div>
      <div class="actions">

        <button onclick="A.renov('${b.id}')">Rénovation complète — ${eur(renovCost(b))}</button>
        ${b.sector !== 'yacht' && b.size < 3 ? `<button onclick="A.expand('${b.id}')">Agrandir (taille ${b.size + 1}) — ${eur(expandCost(b))}</button>` : ''}

        <button class="danger" onclick="A.sellBiz('${b.id}')">Mettre en vente</button>

    <button onclick="A.staffFit('${b.id}')">Ajuster tous les effectifs au besoin</button>

    ${b.sector === 'yacht' ? `<h3>Flotte</h3><table class="t">${b.fleet.map(y => `<tr><td>${YACHTS[y.m].n}${(y.down || 0) > G.day ? ' ' + pill('Immobilisé', 'warn') : ''}</td><td class="num">${eur(y.v)}</td><td><button class="mini" onclick="A.sellYacht('${b.id}','${y.id}')">Vendre</button></td></tr>`).join('')}</table>
      <label for="y_m">Acheter un yacht (payé par la holding)</label><div class="row"><select id="y_m">${YACHTS.map((y, i) => `<option value="${i}">${y.n} — ${eur(y.v)} — ${eur(y.rate)}/jour</option>`).join('')}</select><button onclick="A.addYacht('${b.id}')">Acheter</button></div>` : ''}
  </section></div>`;
};
const mkCost = b => Math.round(Math.max(15000, estMonthly(b).net * .06) / 1000) * 1000;
const renovCost = b => Math.round((80000 * (b.sector === 'yacht' ? 1 : b.size) * cityPrice(CITY[b.city]) * (b.sector === 'hotel' ? 6 : b.sector === 'cardealer' ? 2 : 1) + fleetValue(b) * .05) / 1000) * 1000;
const expandCost = b => Math.round(Math.max(b.cost, b.val) * .55 / 1000) * 1000;

/* --- Immobilier */
PAGES.immo = () => {
  const projs = G.projs.map(p => {

  <section class="card"><h2>Conditions de marché</h2>
    <div class="kv"><span>Taux directeur BCE</span><b>${pct(e.ecb, 2)}</b></div><div class="kv"><span>Euribor 3 mois</span><b>${pct(euribor(), 2)}</b></div>

    <div class="kv"><span>Découvert autorisé</span><b>${eur(overdraftLimit())}</b></div><div class="kv"><span>Agios sur découvert</span><b>${pct(euribor() + .09, 2)}</b></div>
    <p class="muted small">Le score monte quand vous payez à l'heure, chute de 60 points par impayé et de 150 en cas de défaut. Trois impayés consécutifs : saisie de la garantie, puis appel de votre caution personnelle.</p></section>
  <section class="card span2"><h2>Demande de financement</h2>
    <div class="grid g2"><div>
      <label for="l_type">Type de crédit</label><select id="l_type" onchange="A.loanUpd()">${['treso', 're', 'biz', 'lomb'].map(k => `<option value="${k}"${L.type === k ? ' selected' : ''}>${LOANT[k].n}</option>`).join('')}</select>

      <div class="row"><div><label for="l_m">Durée (mois)</label><input id="l_m" type="number" min="6" max="${LOANT[L.type].max}" step="6" value="${L.months}" oninput="A.loanUpd()"></div>
      <div><label for="l_fx">Taux</label><select id="l_fx" onchange="A.loanUpd()" ${LOANT[L.type].varOnly ? 'disabled' : ''}><option value="1"${L.fixed ? ' selected' : ''}>Fixe</option><option value="0"${!L.fixed ? ' selected' : ''}>Variable</option></select></div></div>

    <div><h3>Verser un dividende</h3><p class="muted small">Imposé selon votre pays d'imposition personnel : ${CO(ptc()).f} ${CO(ptc()).n}, ${pct(divTaxRate())}.</p><div class="row"><input id="d_amt" type="number" step="10000" value="100000" aria-label="Montant du dividende"><button class="primary" onclick="A.div()">Verser</button></div></div>

  </div></section>`;

function colOptions(type) {
  if (type === 're') return G.props.filter(p => !p.sale).map(p => ({ v: 'prop:' + p.id, n: `${p.name} — ${eur(propValue(p))} (déjà gagé : ${eur(loansOn({ k: 'prop', id: p.id }))})` }));
  if (type === 'biz') return G.biz.map(b => ({ v: 'biz:' + b.id, n: `${b.name} — ${eur(bizValue(b))} (déjà gagé : ${eur(loansOn({ k: 'biz', id: b.id }))})` }));
  if (type === 'lomb') return portValue() > 0 ? [{ v: 'port:p', n: `Portefeuille titres — ${eur(portValue())} (déjà gagé : ${eur(loansOn({ k: 'port', id: 'p' }))})` }] : [];
  return [];
}
function loanFormObj() {
  const L = UI.loan; const o = { type: L.type, amount: +L.amount || 0, months: +L.months || 12, fixed: L.fixed, country: G.holdC };
  if (L.type !== 'treso') {
    if (!L.col) return null;
    const [k, id] = L.col.split(':'); o.col = { k, id };
    o.value = collateralValue(o.col); o.existing = loansOn(o.col);
    if (k === 'prop') o.country = CITY[G.props.find(p => p.id === id).city].c;
    if (k === 'biz') o.country = CITY[G.biz.find(p => p.id === id).city].c;
  }
  return o;
}
function loanFormQuote() {
  const o = loanFormObj(); if (!o) return '<p class="muted">Aucun actif ne peut servir de garantie pour ce type de crédit.</p>';
  const q = loanQuote(o);
  return quoteBox(q, o.amount) + `<div class="row end"><button class="primary" onclick="A.loanGo()" ${q.ok ? '' : 'disabled'}>Signer l'offre de prêt</button></div>`;
}

};
function resPreview(to) {
  if (to === G.resCity) return '<p class="muted small">Choisissez une autre ville pour simuler un changement de résidence.</p>';
  const r = residencyCalc(to);
  return `<table class="t compact"><tr><td>Frais de déménagement et conseils</td><td class="num">${eur(50000)}</td></tr><tr><td>Exit tax française</td><td class="num">${r.exit ? eur(r.exit) : r.exitNote || '—'}</td></tr>${r.mc ? `<tr><td>Dépôt bloqué en banque monégasque</td><td class="num">${eur(500000)}</td></tr>` : ''}<tr><td>Nouveau taux sur dividendes</td><td class="num">${pct(CO(r.toPtc).div)}</td></tr><tr><td>Impôt sur la fortune</td><td class="num">${CO(r.toPtc).wt ? pct(CO(r.toPtc).wt.r) : 'aucun'}</td></tr><tr><td>Loyer de résidence estimé</td><td class="num">${eur(r.rent)}/mois</td></tr></table>
  ${r.toPtc !== CITY[to].c ? '<p class="warnline">Vous resterez imposé en France (convention de 1963).</p>' : ''}${r.err ? `<p class="neg small">${esc(r.err)}</p>` : ''}<button class="primary" onclick="A.move('${to}')" ${r.err ? 'disabled' : ''}>Transférer ma résidence</button>`;
}
function residencyCalc(to) {
  const ci = CITY[to], toPtc = (ci.c === 'MC' && G.nat === 'FR') ? 'FR' : ci.c, from = ptc();
  let exit = 0, exitNote = '';
  const holdEq = netWorth() - G.perso - G.monacoDep - luxValue();
  if (from === 'FR' && toPtc !== 'FR' && holdEq > 8e5) { const gain = Math.max(0, holdEq - G.contrib); if (EU.has(toPtc)) exitNote = 'sursis automatique (UE)'; else exit = gain * .3; }
  const mc = ci.c === 'MC' && CITY[G.resCity].c !== 'MC';
  const need = 50000 + exit + (mc ? 500000 : 0);
  const rent = G.lux.some(x => LUX[x.i].city === to) ? 0 : ci.m2 * .45;
  return { toPtc, exit, exitNote, mc, need, rent, err: G.perso < need ? `Il vous faut ${eur(need)} sur votre compte personnel.` : '' };
}

   ACTIONS
   ========================================================================== */
const A = {
  go(p) { UI.page = p; render(); window.scrollTo(0, 0); },
  city(id) { UI.city = id; UI.page = 'ville'; render(); window.scrollTo(0, 0); },
  bizd(id) { UI.biz = id; UI.page = 'bizd'; render(); window.scrollTo(0, 0); },
  start() {
    const cap = +$('#s_cap').value;
    newGame({ name: $('#s_name').value.trim() || 'Vous', nat: $('#s_nat').value, resCity: $('#s_res').value, holdC: $('#s_hold').value, capital: cap, diff: cap });
    UI.page = 'dash'; render(); save(); A.help();
  },
  continue() { if (load()) { UI.page = 'dash'; render(); } },
  reset() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } G = null; closeModal(); render(); },
  adv(n) {
    if (!G || G.over) return;
    if (G.pending.length) { toast('Répondez d\'abord aux décisions en attente.', true); UI.page = 'dash'; render(); return; }
    for (let i = 0; i < n; i++) { nextDay(); if (G.pending.length || G.over) break; }
    if (G.pending.length) UI.page = 'dash';
    render(); save();
  },
  decide(id, i) { resolveDecision(id, i); render(); save(); },
  buy(lid) {
    const L = G.listings.find(x => x.lid === lid); if (!L) return;
    UI.buy = { lid, pct: L.kind === 'land' ? .6 : L.kind === 're' ? .7 : .5, months: L.kind === 'land' ? 36 : L.kind === 're' ? 240 : 84, fixed: true, ptype: L.allowed ? L.allowed[L.allowed.length - 1] : null };
    // propose d'emblée le financement maximal que la banque accepte
    const ci = CITY[L.city];
    for (let p = UI.buy.pct; p > 0; p = Math.round((p - .05) * 100) / 100) {
      let q;
      if (L.kind === 'biz') q = loanQuote({ type: 'biz', amount: p * L.price, months: UI.buy.months, fixed: true, value: L.price, income: L.estE, country: ci.c });
      else if (L.kind === 're') q = loanQuote({ type: 're', amount: p * L.price, months: UI.buy.months, fixed: true, value: Math.min(L.price, propValue(L.p)), income: propNetMonthly(L.p), country: ci.c });
      else break;
      UI.buy.pct = p; if (q.ok) break; UI.buy.pct = 0;
    }
    modal(buyHtml(), true);
  },
  buyUpd(full) {
    const B = UI.buy; B.pct = +$('#b_pct').value; B.months = +$('#b_m').value; B.fixed = $('#b_fx').value === '1'; if ($('#b_type')) B.ptype = $('#b_type').value;
    $('#modal .mbox').innerHTML = buyHtml();
  },
  buyGo() {
    const B = UI.buy, L = G.listings.find(x => x.lid === B.lid); if (!L) return closeModal();
    const C = CO(CITY[L.city].c);
    let base = L.kind === 'land' ? (L.price * (1 + C.mut) + landRef(CITY[L.city], B.ptype, L.m2).build) : L.price;
    const amount = Math.round(B.pct * base / 1000) * 1000;
    const err = acquireListing(L, { amount, months: B.months, fixed: B.fixed, ptype: B.ptype });
    if (err) return toast(err, true);
    closeModal(); toast('Acquisition signée.'); render(); save();
  },
  price(id, v) { const b = G.biz.find(x => x.id === id); b.price = v; render(); },
  mk(id) { const b = G.biz.find(x => x.id === id), c = mkCost(b); if (G.hold < c) return toast('Trésorerie insuffisante', true); G.hold -= c; G.tb[CITY[b.city].c] = (G.tb[CITY[b.city].c] || 0) - c; b.mk = G.day + 30; news('info', `📣 Campagne marketing lancée pour ${b.name} (${eur(c)}).`); render(); },
  renov(id) { const b = G.biz.find(x => x.id === id), c = renovCost(b); if (G.hold < c) return toast('Trésorerie insuffisante', true); G.hold -= c; b.cond = 100; b.rep = Math.min(100, b.rep + 5); b.closedUntil = Math.max(b.closedUntil, G.day + 14); b.val += c * .5; news('info', `🛠️ Rénovation de ${b.name} (${eur(c)}) : fermeture 14 jours.`); render(); },
  expand(id) { const b = G.biz.find(x => x.id === id), c = expandCost(b); if (G.hold < c) return toast('Trésorerie insuffisante', true); G.hold -= c; b.size++; b.cost += c; b.val += c * .8; b.closedUntil = Math.max(b.closedUntil, G.day + 30); news('info', `🏗️ Agrandissement de ${b.name} (${eur(c)}) : fermeture 30 jours. Pensez à recruter.`); render(); },
  ins(id) { const b = G.biz.find(x => x.id === id); b.insured = !b.insured; render(); },
  sellBiz(id) {
    const b = G.biz.find(x => x.id === id), offer = Math.round(bizValue(b) * rnd(.88, 1.04) / 1000) * 1000, debt = loansOn({ k: 'biz', id });
    modal(`<h2>Céder ${esc(b.name)}</h2><p>Un acquéreur propose <b>${eur(offer)}</b>. Frais de cession 4 %. Prêts adossés remboursés : ${eur(debt)}. Plus-value imposable : ${eur(offer * .96 - b.cost)}.</p><div class="row end"><button class="ghost" onclick="closeModal()">Refuser</button><button class="primary" onclick="A.sellBizGo('${id}',${offer})">Accepter</button></div>`);
  },
  sellBizGo(id, offer) { const b = G.biz.find(x => x.id === id); if (b) sellBiz(b, offer); closeModal(); UI.page = 'biz'; render(); save(); },
  staff(id, r, d) {
    const b = G.biz.find(x => x.id === id), C = CO(CITY[b.city].c), sal = roleInfo(b, r)[2] * C.wage;
    if (d > 0) { G.hold -= sal * .5; b.staff[r] = (b.staff[r] || 0) + 1; }
    else if ((b.staff[r] || 0) > 0) { G.hold -= sal * C.sev; b.staff[r]--; if (R() < .15 * C.sev / 2) { const f = sal * 6; G.hold -= f; news('bad', `⚖️ Contestation du licenciement aux prud'hommes (${b.name}) : ${eur(f)}.`); } }
    render();
  },
  staffFit(id) {
    const b = G.biz.find(x => x.id === id), req = staffReq(b), C = CO(CITY[b.city].c); let cost = 0;
    for (const r in req) { const d = req[r] - (b.staff[r] || 0), sal = roleInfo(b, r)[2] * C.wage; cost += d > 0 ? d * sal * .5 : -d * sal * C.sev; b.staff[r] = req[r]; }
    for (const r in b.staff) if (!(r in req)) { cost += b.staff[r] * roleInfo(b, r)[2] * C.wage * C.sev; delete b.staff[r]; }
    G.hold -= cost; toast(`Effectifs ajustés (coût ${eur(cost)})`); render();
  },
  dirCands(id) {
    const b = G.biz.find(x => x.id === id), c = CITY[b.city].c;
    UI.dirC = [genDirector(c), genDirector(c), genDirector(c, 1.15)];
    modal(`<h2>Recruter un directeur — ${esc(b.name)}</h2><p class="muted small">Le cabinet de chasse facture 3 mois de salaire. Un profil « Véreux » peut détourner des fonds.</p><table class="t">${UI.dirC.map((d, i) => `<tr><td><b>${esc(d.n)}</b><span class="muted small"> · ${esc(d.trait)}</span></td><td class="num">Compétence ${d.skill}</td><td class="num">${eur(d.sal)}/mois</td><td><button class="mini primary" onclick="A.hireDir('${id}',${i})">Recruter</button></td></tr>`).join('')}</table><div class="row end"><button class="ghost" onclick="closeModal()">Fermer</button></div>`);
  },
  hireDir(id, i) { const b = G.biz.find(x => x.id === id), d = UI.dirC[i]; G.hold -= d.sal * 3; if (b.dir) G.hold -= b.dir.sal * CO(CITY[b.city].c).sev; b.dir = d; news('info', `👔 ${d.n} prend la direction de ${b.name}.`); closeModal(); render(); },
  fireDir(id) { const b = G.biz.find(x => x.id === id); G.hold -= b.dir.sal * CO(CITY[b.city].c).sev * 1.5; news('info', `${b.dir.n} quitte la direction de ${b.name}.`); b.dir = null; render(); },
  addYacht(id) { const b = G.biz.find(x => x.id === id), m = +$('#y_m').value, Y = YACHTS[m]; if (G.hold < Y.v) return toast('Trésorerie insuffisante', true); G.hold -= Y.v; b.fleet.push({ id: uid(), m, v: Y.v }); b.cost += Y.v; news('good', `🛥️ Nouveau ${Y.n} dans la flotte de ${b.name}. Recrutez l'équipage.`); render(); },
  sellYacht(id, yid) { const b = G.biz.find(x => x.id === id), y = b.fleet.find(x => x.id === yid); if (b.fleet.length <= 1) return toast('Gardez au moins un yacht ou cédez la société.', true); G.hold += y.v * .92; b.fleet = b.fleet.filter(x => x !== y); render(); },
  sellProp(id, mode) { const p = G.props.find(x => x.id === id); sellProp(p, mode); render(); save(); },
  renovProp(id) { const p = G.props.find(x => x.id === id), c = p.m2 * 450 * cityPrice(CITY[p.city]) * (1 - p.cond / 100) * 2; if (G.hold < c) return toast('Trésorerie insuffisante', true); G.hold -= c; p.cond = 100; p.cost += c; news('info', `🛠️ Rénovation de ${p.name} : ${eur(c)}.`); render(); },
  loanUpd() {
    const L = UI.loan, t = $('#l_type').value; const changed = t !== L.type; L.type = t;
    if ($('#l_col')) L.col = $('#l_col').value; L.amount = +$('#l_amt').value; L.months = Math.min(+$('#l_m').value, LOANT[t].max); L.fixed = $('#l_fx').value === '1';
    if (changed) { L.col = ''; render(); } else $('#l_quote').innerHTML = loanFormQuote();
  },
  loanGo() { const o = loanFormObj(); const q = loanQuote(o); if (!q.ok) return; createLoan(o, q, LOANT[o.type].n); toast('Prêt signé, fonds versés sur la holding.'); render(); save(); },
  repay(id) { const l = G.loans.find(x => x.id === id); const pen = (l.fixed ? .03 : .01) * l.rem; if (G.hold < l.rem + pen) return toast(`Il faut ${eur(l.rem + pen)} de trésorerie (indemnité incluse).`, true); repayLoan(l, l.rem); toast(`Prêt remboursé (indemnité ${eur(pen)}).`); render(); },
  div() { const a = +$('#d_amt').value; if (!(a > 0) || a > G.hold) return toast('Montant invalide ou trésorerie insuffisante', true); payDividend(a); render(); },
  contrib() { const a = +$('#c_amt').value; if (!(a > 0) || a > G.perso) return toast('Montant invalide', true); contribute(a); render(); },
  trade(t, sign) { const q = Math.floor(+$('#q_' + t).value); if (!(q > 0)) return; if (!tradeStock(t, sign * q)) return toast('Ordre refusé (trésorerie ?)', true); toast('Ordre exécuté.'); render(); },
  hireExec(k, i) { const c = G.cands[k][i]; if (G.execs[k]) G.hold -= G.execs[k].sal * .5; G.hold -= c.sal * .25; G.execs[k] = c; G.cands[k].splice(i, 1); news('info', `👔 ${c.n} rejoint la holding : ${EXECS[k].n}.`); render(); },
  fireExec(k) { G.hold -= G.execs[k].sal * .5; news('info', `${G.execs[k].n} quitte le groupe.`); delete G.execs[k]; render(); },
  luxCat(c) { UI.luxCat = c; render(); },
  buyLux(i) { const L = LUX[i]; if (G.perso < L.p) return toast('Compte personnel insuffisant : versez-vous un dividende.', true); G.perso -= L.p; G.lux.push({ id: uid(), i, v: L.p, d: G.day }); news('good', `💎 Achat : ${L.n} (${eur(L.p)}).`); render(); },
  sellLux(id) { const x = G.lux.find(y => y.id === id); G.perso += x.v * .9; G.lux = G.lux.filter(y => y !== x); news('info', `Revente : ${LUX[x.i].n} pour ${eur(x.v * .9)}.`); render(); },
  resPrev() { UI.resTo = $('#r_city').value; $('#r_prev').innerHTML = resPreview(UI.resTo); },
  move(to) {
    const r = residencyCalc(to); if (r.err) return;
    G.perso -= 50000 + r.exit; if (r.exit) { G.tot.other += r.exit; G.ytd.other += r.exit; }
    if (CITY[G.resCity].c === 'MC' && CITY[to].c !== 'MC') { G.perso += G.monacoDep; G.monacoDep = 0; }
    if (r.mc) { G.perso -= 500000; G.monacoDep = 500000; }
    G.resCity = to; G.flatIT = false; UI.resTo = null;
    news('info', `✈️ Nouvelle résidence fiscale : ${CITY[to].n}.${r.exit ? ` Exit tax payée : ${eur(r.exit)}.` : ''}`);
    render(); save();
  },
  flatIT() { G.flatIT = !G.flatIT; render(); },
  jf(f) { UI.jf = f; render(); },
  help() {
    modal(`<h2>Guide du jeu</h2><div class="help">
    <p><b>Principe.</b> Chaque clic sur « Jour suivant » fait tourner l'économie d'une journée : vos établissements encaissent leur chiffre d'affaires, paient salaires et loyers, les marchés bougent, des incidents surviennent. Le 1<sup>er</sup> de chaque mois : loyers, échéances bancaires, impôt sur les sociétés, décisions de la BCE.</p>
    <p><b>Deux poches.</b> Votre <i>holding</i> détient les entreprises, l'immobilier et les titres. Votre <i>compte personnel</i> paie votre train de vie, vos biens de luxe et vos impôts personnels. Passer de l'une à l'autre coûte un impôt sur les dividendes qui dépend de votre résidence fiscale.</p>
    <p><b>Acheter.</b> Ouvrez la carte, choisissez une ville, étudiez une opportunité. La banque finance une partie si votre capacité de remboursement (DSCR ≥ 1,20), votre apport (LTV) et votre score le permettent. Les droits de mutation dépendent du pays.</p>
    <p><b>Gérer.</b> Un établissement sans directeur ou en sous-effectif perd en qualité, en réputation puis en chiffre d'affaires. Les agents d'entretien protègent l'état des locaux, la sécurité protège les clubs des fermetures.</p>
    <p><b>Promotion immobilière.</b> Achetez un terrain, choisissez le programme, attendez le permis (lent en Italie, rapide en Suisse), financez les travaux par un crédit promoteur, puis vendez ou louez à la livraison.</p>
    <p><b>Risques.</b> Récessions, krachs, pandémies, crises immobilières, réformes fiscales, contrôles fiscaux, grèves, incendies. Trois impayés et la banque saisit la garantie, puis votre caution personnelle. Patrimoine négatif sans revenus : faillite.</p>
    <p><b>Raccourci.</b> Touche N : jour suivant.</p></div><div class="row end"><button class="primary" onclick="closeModal()">Commencer</button></div>`, true);
  },
  saveMenu() {
    let s = ''; try { s = btoa(unescape(encodeURIComponent(JSON.stringify(G)))); } catch (e) { }
    modal(`<h2>Sauvegarde</h2><p class="muted small">La partie est enregistrée automatiquement dans ce navigateur. Pour la transférer, copiez ce code et collez-le dans « Importer une sauvegarde ».</p><textarea id="sv" rows="6" readonly>${s}</textarea><div class="row end"><button onclick="A.copySave()">Copier le code</button><button class="danger" onclick="A.reset()">Abandonner et recommencer</button><button class="primary" onclick="closeModal()">Fermer</button></div>`);
  },
  copySave() { try { navigator.clipboard.writeText($('#sv').value).then(() => toast('Code copié.'), () => toast('Copie refusée : sélectionnez le texte manuellement.', true)); } catch (e) { toast('Copie impossible ici.', true); } },
  import() { modal(`<h2>Importer une sauvegarde</h2><textarea id="imp" rows="6" placeholder="Collez le code ici"></textarea><div class="row end"><button class="ghost" onclick="closeModal()">Annuler</button><button class="primary" onclick="A.importGo()">Importer</button></div>`); },
  importGo() { try { G = JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))); closeModal(); UI.page = 'dash'; render(); save(); } catch (e) { toast('Code invalide.', true); } },
};
window.A = A; window.closeModal = closeModal;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').className === 'open' && G && !G.over) closeModal();
  if ((e.key === 'n' || e.key === 'N') && G && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName) && $('#modal').className !== 'open') A.adv(1);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && G && !G.over) closeModal(); });
render();

</script>
</body>
</html>
